<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#1a1145">
<title>Vaka 6 · Midesiz — ZY-11</title>
<link rel="stylesheet" href="assets/style.css">
<script data-theme-boot>try{document.documentElement.dataset.theme=JSON.parse(localStorage.getItem("zy11_profile")||"{}").theme||"gece"}catch(e){}</script>
<style>
.kitchen { height: 360px; touch-action: none; cursor: none;
  background: radial-gradient(circle at 50% 120%, rgba(255,77,94,.55), transparent 60%), radial-gradient(circle at 20% 0%, rgba(255,138,61,.35), transparent 50%), linear-gradient(180deg, #2a1550, #150b33); }
.kitchen .hole { position: absolute; left: 50%; bottom: -60px; width: 260px; height: 120px; transform: translateX(-50%); border-radius: 50%; background: radial-gradient(closest-side, #000, transparent); opacity: .5; }
.food { position: absolute; left: 0; top: 0; font-size: 2rem; line-height: 1; will-change: transform; pointer-events: none; filter: drop-shadow(0 4px 6px rgba(0,0,0,.45)); }
.food.bad { filter: drop-shadow(0 0 10px rgba(166,255,77,.9)); }
.eater { position: absolute; bottom: 10px; left: 50%; width: 76px; height: 76px; margin-left: -38px; display: grid; place-items: center; font-size: 3rem; pointer-events: none; z-index: 3; transition: transform .08s ease; }
.eater::before { content: ''; position: absolute; inset: 4px; border-radius: 50%; background: radial-gradient(circle, rgba(255,210,63,.45), transparent 70%); }
.eater.chomp { transform: scale(1.3); }
.eater.sick { animation: shake .4s ease; }
.lives { letter-spacing: 2px; }
</style>
</head>
<body>
<div class="app" id="app"></div>
<template id="mission">
  <div class="hud"><span class="pill">🍽 <b id="score">0</b><span id="scoreMax">/15</span></span><span class="pill lives" id="lives">❤️❤️❤️</span></div>
  <div class="bar"><div id="prog"></div></div>
  <div class="arena kitchen" id="arena"><div class="hole"></div><div class="eater" id="eater">😋</div></div>
  <button class="btn" id="startBtn">🍕 Yemek Yağmurunu Başlat</button>
  <div class="status" id="status"></div>
</template>

<script src="assets/zy11.js"></script>
<script>
let ARC = null, TARGET = 15; const FOODS = ['🍕','🌭','🍟','🌶️','🥙','🍫','🥒','🍝','🍔','🧄','🍩','🌮'];
const LINES = { '🌶️': 'Acı mı? Hiç hissetmedi.', '🥒': 'Turşu + çikolata kombosu!', '🍫': 'Tatlı başka mide 🍫', '🍕': 'Soğuk pizza, kahvaltılık.' };
let arena, eater, statusEl, foods = [], score, lives, ex = .5, raf, last, acc, running = false;

function setX(x) { ex = Math.max(.08, Math.min(.92, x)); eater.style.left = (ex * 100) + '%'; }
function hud() { ZY.$('#score').textContent = score; ZY.$('#scoreMax').textContent = ARC ? '' : '/15'; ZY.$('#lives').textContent = '❤️'.repeat(lives) + '🖤'.repeat(3 - lives); ZY.$('#prog').style.width = (ARC ? 100 : score / TARGET * 100) + '%'; }
function clear() { foods.forEach(f => f.el.remove()); foods = []; }

function init(arc) {
  if (arc !== undefined) ARC = arc; TARGET = ARC ? Infinity : 15;
  arena = ZY.$('#arena'); eater = ZY.$('#eater'); statusEl = ZY.$('#status');
  running = false; cancelAnimationFrame(raf); clear(); score = 0; lives = 3; hud(); setX(.5); eater.textContent = '😋';
  ZY.arenaMsg(arena, '🕳️', 'Kara delik mide aç!', 'Parmağını sürükle, yemekleri yakala. 🥗 salatadan kaç!');
  const b = ZY.$('#startBtn'); b.style.display = ''; b.disabled = false; b.textContent = '🍕 Yemek Yağmurunu Başlat'; b.onclick = start;
  statusEl.textContent = '';
  arena.onpointerdown = e => { e.preventDefault(); move(e); };
  arena.onpointermove = move;
}
function move(e) { if (!running) return; const r = arena.getBoundingClientRect(); setX((e.clientX - r.left) / r.width); }
document.addEventListener('keydown', e => { if (!running) return; if (e.key === 'ArrowLeft') setX(ex - .08); if (e.key === 'ArrowRight') setX(ex + .08); });

async function start() {
  const b = ZY.$('#startBtn'); b.disabled = true; ZY.arenaMsg(arena); clear(); score = 0; lives = 3; hud();
  await ZY.countdown(arena);
  b.style.display = 'none'; running = true; last = performance.now(); acc = 0;
  statusEl.className = 'status'; statusEl.textContent = '"Bir şey olmaz ya." 😋';
  raf = requestAnimationFrame(loop);
}
function spawn() {
  const bad = Math.random() < .27, el = document.createElement('div');
  el.className = 'food' + (bad ? ' bad' : ''); el.textContent = bad ? '🥗' : FOODS[Math.floor(Math.random() * FOODS.length)];
  arena.appendChild(el);
  foods.push({ el, bad, x: .08 + Math.random() * .84, y: -40, v: (130 + Math.random() * 90) * (1 + Math.min(score, 60) * (ARC ? .025 : .045)), rot: 0, vr: (Math.random() - .5) * 6, sway: Math.random() * 6 });
}
function loop(t) {
  if (!running) return;
  const dt = Math.min(.05, (t - last) / 1000); last = t; acc += dt;
  if (acc > Math.max(ARC ? .3 : .42, .9 - score * (ARC ? .012 : .028))) { acc = 0; spawn(); }
  const W = arena.clientWidth, H = arena.clientHeight, ey = H - 48, rect = arena.getBoundingClientRect();
  for (let i = foods.length - 1; i >= 0; i--) {
    const f = foods[i]; f.y += f.v * dt; f.rot += f.vr * dt * 60; f.sway += dt * 3;
    const px = f.x * W + Math.sin(f.sway) * 6;
    f.el.style.transform = 'translate(' + (px - 16) + 'px,' + f.y + 'px) rotate(' + f.rot + 'deg)';
    if (f.y > ey - 34 && f.y < ey + 10 && Math.abs(px - ex * W) < 40) {
      f.el.remove(); foods.splice(i, 1);
      eater.classList.add('chomp'); setTimeout(() => eater.classList.remove('chomp'), 110);
      if (f.bad) {
        lives--; hud(); ZY.sfx.bad(); ZY.shake(arena); eater.textContent = '🤢'; setTimeout(() => running && (eater.textContent = '😋'), 600);
        ZY.burst(rect.left + px, rect.top + ey, { colors: ['#a6ff4d', '#3ddc84'], count: 18 });
        ZY.floatText(arena, px, ey - 30, 'salata! 🤢', true);
        statusEl.className = 'status bad'; statusEl.textContent = 'Diyet salatası! Zanlı yavaşça uzaklaşıyor...';
        if (lives <= 0) return end(false);
      } else {
        score++; hud(); ZY.beep(480 + score * 30, .07, 'triangle'); ZY.buzz(12);
        ZY.burst(rect.left + px, rect.top + ey - 10, { count: 10, colors: ['#ffd23f', '#ff8a3d', '#fff'], speed: 4 });
        ZY.floatText(arena, px, ey - 30, '+1');
        if (LINES[f.el.textContent] && Math.random() < .5) { statusEl.className = 'status'; statusEl.textContent = LINES[f.el.textContent]; }
        if (score >= TARGET) return end(true);
      }
    } else if (f.y > H + 20) { f.el.remove(); foods.splice(i, 1); }
  }
  raf = requestAnimationFrame(loop);
}
function end(won) {
  running = false; cancelAnimationFrame(raf); clear();
  const b = ZY.$('#startBtn');
  ZY.stat('foods', score);
  if (ARC) { eater.textContent = '😵'; ZY.arenaMsg(arena, '🥗', 'Salata kazandı!', score + ' yemek'); b.style.display = ''; b.disabled = false; b.textContent = '🔁 Tekrar'; return ZY.arcadeEnd(score); }
  if (!won) { eater.textContent = '😵'; ZY.arenaMsg(arena, '🥗', 'Salata kazandı!', score + ' yemek yedin'); b.style.display = ''; b.disabled = false; b.textContent = '🔁 Tekrar Dene'; return; }
  eater.textContent = '🤤'; ZY.arenaMsg(arena, '🕳️', '15 yemek yok oldu', 'Mide hâlâ bulunamadı');
  ZY.complete({ stars: lives, stats: '❤️ ' + lives + ' can kaldı', msg: 'Zanlı: "Tatlı var mı?" 🍩' });
}
ZY.onHidden(() => { if (running) end(false); });

ZY.page(6, {
  intro: '5. vakanın devam dosyası. "Doymayan" lakabı yetmediği için ikinci bir soruşturma açıldı: zanlının midesi gerçekten var mı?',
  evidence: [
    'Zanlının yediği kombinasyonlar bilim insanlarını şaşkına çevirdi: turşunun yanına çikolata, kahvaltıda soğuk pizza, gece yarısı acılı dürüm. Hepsinden sonra tek yorumu: "Bir şey olmaz ya."',
    'Herkesin "bu çok acı" diyerek bıraktığı yemeği tek kaşta bitirip "bence biraz daha acı olabilirdi" dedi. Olay yerindeki tanıklar hâlâ su içiyor.',
    'Yemekten yeni kalkmışken "tatlı başka mide" diyerek ikinci bir bölmenin varlığını iddia etti. Ama ilk bölmenin nerede olduğu hâlâ tespit edilemedi.',
    'Zanlının tek bir düşmanı var: diyet salatası 🥗. Gördüğü anda yüz ifadesi değişiyor ve yavaşça uzaklaşıyor.',
  ],
  verdict: 'Zanlının midesi bulunamamıştır — yerinde sadece "bir şey olmaz ya" yazan küçük bir kara delik tespit edilmiştir. 🌶️🕳️',
  mission: { title: '🍕 Kara Delik Mide', sub: 'Parmağını sürükleyerek zanlıyı kaydır, 15 yemek yakala. 🥗 Diyet salatası bir can götürür!', goals: ['Bitir', '2 can kala', 'Hiç salata yeme'] },
  init,
});
</script>
</body>
</html>
