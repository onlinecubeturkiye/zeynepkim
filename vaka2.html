<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#1a1145">
<title>Vaka 2 · Spastik — ZY-11</title>
<link rel="stylesheet" href="assets/style.css">
<script data-theme-boot>try{document.documentElement.dataset.theme=JSON.parse(localStorage.getItem("zy11_profile")||"{}").theme||"gece"}catch(e){}</script>
<style>
.mem-arena { padding: 16px; }
.memory-grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 10px; perspective: 800px; }
.mcard { aspect-ratio: 3 / 4; position: relative; cursor: pointer; }
.mcard .inner { position: absolute; inset: 0; transition: transform 0.45s cubic-bezier(.3,1.4,.6,1); transform-style: preserve-3d; }
.mcard.flipped .inner, .mcard.matched .inner { transform: rotateY(180deg); }
.mcard .face { position: absolute; inset: 0; border-radius: 14px; display: grid; place-items: center; backface-visibility: hidden; -webkit-backface-visibility: hidden; }
.mcard .back {
  background: linear-gradient(135deg, #ffd23f, #ff8a3d); box-shadow: 0 6px 0 #b8541a, 0 8px 14px rgba(0,0,0,.4);
  font-size: 1.4rem; color: rgba(90,30,0,.45);
}
.mcard .back::before { content: ''; position: absolute; inset: 6px; border-radius: 10px; border: 2px dashed rgba(255,255,255,.45); }
.mcard .front { transform: rotateY(180deg); background: #fff; font-size: 2rem; box-shadow: 0 6px 0 #c9c2e8, 0 8px 14px rgba(0,0,0,.4); }
.mcard.matched .front { background: linear-gradient(135deg, #d9ffb8, #a6ff4d); box-shadow: 0 6px 0 #5aa61f, 0 0 18px rgba(166,255,77,.6); }
.mcard.matched .inner { animation: matchPop .45s ease .35s; }
@keyframes matchPop { 50% { transform: rotateY(180deg) scale(1.12); } }
.mcard.nope .inner { animation: nope .4s ease; }
@keyframes nope { 25% { transform: rotateY(180deg) rotate(-6deg); } 75% { transform: rotateY(180deg) rotate(6deg); } }
</style>
</head>
<body>
<div class="app" id="app"></div>
<template id="mission">
  <div class="hud">
    <span class="pill">🔗 <b id="pairs">0</b>/6</span>
    <span class="pill">👆 <b id="moves">0</b> hamle</span>
    <span class="pill">⏱ <b id="time">0</b>s</span>
  </div>
  <div class="arena mem-arena" id="arena"><div class="memory-grid" id="grid"></div></div>
  <button class="btn" id="startBtn">⚡ Testi Başlat</button>
  <div class="status" id="status"></div>
</template>

<script src="assets/zy11.js"></script>
<script>
const SYMBOLS = ['⚡','🐱','🎾','💥','🔋','😹'];
let grid, arena, deck, first, lock, matched, moves, secs, tick, running;

function init() {
  grid = ZY.$('#grid'); arena = ZY.$('#arena');
  clearInterval(tick); running = false;
  deck = ZY.shuffle([...SYMBOLS, ...SYMBOLS]).map(s => ({ s }));
  first = null; lock = true; matched = 0; moves = 0; secs = 0;
  ZY.$('#pairs').textContent = 0; ZY.$('#moves').textContent = 0; ZY.$('#time').textContent = 0; ZY.$('#status').textContent = '';
  grid.innerHTML = '';
  deck.forEach((c, i) => {
    const el = document.createElement('div');
    el.className = 'mcard';
    el.innerHTML = '<div class="inner"><div class="face back">⚡</div><div class="face front">' + c.s + '</div></div>';
    el.addEventListener('pointerdown', e => { e.preventDefault(); flip(i); });
    c.el = el; grid.appendChild(el);
  });
  const b = ZY.$('#startBtn'); b.style.display = ''; b.disabled = false; b.onclick = start;
  ZY.arenaMsg(arena, '🧠', 'Kafa 200 km hızla gidiyor', 'Kartlar 1 saniyeliğine açılacak, iyi bak!');
}

async function start() {
  ZY.$('#startBtn').style.display = 'none'; ZY.arenaMsg(arena);
  deck.forEach((c, i) => setTimeout(() => c.el.classList.add('flipped'), i * 40));
  await ZY.wait(1400);
  deck.forEach(c => c.el.classList.remove('flipped'));
  await ZY.wait(450);
  lock = false; running = true;
  tick = setInterval(() => { secs++; ZY.$('#time').textContent = secs; }, 1000);
}

function flip(i) {
  const c = deck[i];
  if (lock || c.el.classList.contains('flipped') || c.el.classList.contains('matched')) return;
  c.el.classList.add('flipped'); ZY.sfx.tap();
  if (first === null) { first = i; return; }
  moves++; ZY.$('#moves').textContent = moves;
  const a = deck[first]; first = null;
  if (a.s === c.s) {
    a.el.classList.add('matched'); c.el.classList.add('matched');
    matched++; ZY.$('#pairs').textContent = matched;
    setTimeout(() => { ZY.burstAt(c.el, { count: 14, colors: ['#a6ff4d', '#fff', '#ffd23f'] }); ZY.sfx.good(); ZY.buzz(20); }, 300);
    if (matched === SYMBOLS.length) {
      clearInterval(tick); running = false;
      setTimeout(() => ZY.complete({
        stars: moves <= 8 ? 3 : moves <= 11 ? 2 : 1,
        stats: '👆 ' + moves + ' hamle · ⏱ ' + secs + ' sn',
        msg: moves <= 8 ? 'Zanlı seviyesinde hızlı bir kafa! ⚡' : 'Enerjini kontrol edebiliyorsun.',
      }), 900);
    }
  } else {
    lock = true;
    setTimeout(() => { a.el.classList.add('nope'); c.el.classList.add('nope'); }, 380);
    setTimeout(() => { [a, c].forEach(x => x.el.classList.remove('flipped', 'nope')); lock = false; }, 900);
  }
}

ZY.page(2, {
  intro: 'Zanlının enerji seviyesiyle ilgili birden fazla ihbar aldık. Ölçümler yapıldı, sonuçlar oldukça çarpıcı çıktı.',
  evidence: [
    'Bir kedi görüldüğü anda zanlının davranışları anında değişiyor: garip sesler çıkarmaya, bilinmeyen bir dilde konuşmaya başlıyor. Uzmanlar buna "kedi modu" adını verdi, tedavisi de aranmıyor.',
    'Salıncakta sallanırken aynı anda kafasında koca bir dünya kurup overthink etme alışkanlığı tespit edildi. Vücut sakin, kafa 200 km hızla gidiyor.',
    'Enerjisi o kadar bulaşıcı ki bir arkadaş grubunun tamamını kendi frekansına çekmeyi başardı — herkes "bu senin yüzünden böyle olduk" diyor ama kimse şikayetçi değil.',
    '"Dur biraz" dedirtip iki dakika sonra yine başladığı tek şey: mükemmel espriler. Durdurulması imkansız, dinlenmesi ise zorunlu.',
  ],
  verdict: 'Zanlının enerjisi bir suç unsuru değil, etrafındaki herkesin gününü kurtaran gizli bir güç olarak değerlendirilmiştir. Dosya "tehlikeli derecede sevimli" kategorisine alınmıştır. ⚡',
  mission: { title: '🧠 Enerji Testi', sub: 'Kartları ezberle, sonra 6 çifti bul. Ne kadar az hamle, o kadar çok yıldız!', goals: ['Bitir', '11 hamle', '8 hamle'] },
  init,
});
</script>
</body>
</html>
