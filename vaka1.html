<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#1a1145">
<title>Vaka 1 · Hırsız Kedi — ZY-11</title>
<link rel="stylesheet" href="assets/style.css">
<script data-theme-boot>try{document.documentElement.dataset.theme=JSON.parse(localStorage.getItem("zy11_profile")||"{}").theme||"gece"}catch(e){}</script>
<style>
.roof { height: 320px; }
.roof .moon { position: absolute; top: 16px; right: 22px; width: 54px; height: 54px; border-radius: 50%; background: radial-gradient(circle at 35% 35%, #fff8d6, #ffd23f); box-shadow: 0 0 40px rgba(255,210,63,0.6); }
.roof .skyline { position: absolute; left: 0; right: 0; bottom: 0; height: 70px; background:
  linear-gradient(#0c0726, #0c0726) 0 30px / 18% 100% no-repeat, linear-gradient(#0c0726, #0c0726) 20% 10px / 14% 100% no-repeat,
  linear-gradient(#0c0726, #0c0726) 38% 40px / 20% 100% no-repeat, linear-gradient(#0c0726, #0c0726) 62% 0 / 12% 100% no-repeat,
  linear-gradient(#0c0726, #0c0726) 78% 26px / 24% 100% no-repeat; opacity: 0.9; }
.target {
  position: absolute; width: 62px; height: 62px; margin: -31px 0 0 -31px; border: none; background: none; cursor: pointer; z-index: 3;
  display: grid; place-items: center; font-size: 2.2rem; animation: popIn 0.22s cubic-bezier(.3,1.7,.6,1);
}
.target::before { content: ''; position: absolute; inset: 2px; border-radius: 50%; border: 3px solid var(--ring, var(--cyan)); opacity: 0.9;
  animation: ring var(--life, 900ms) linear forwards; box-shadow: 0 0 14px var(--ring, var(--cyan)); }
.target.bomb { --ring: var(--red); } .target.heart { --ring: var(--yellow); }
.target span { filter: drop-shadow(0 4px 6px rgba(0,0,0,0.5)); }
@keyframes ring { from { transform: scale(1); } to { transform: scale(0.35); opacity: 0.2; } }
@keyframes popIn { from { transform: scale(0); } }
.combo { position: absolute; top: 12px; left: 14px; z-index: 4; font-family: var(--font-head); font-weight: 800; color: var(--yellow); font-size: 1.1rem; opacity: 0; transition: opacity .2s; text-shadow: 0 0 12px rgba(255,210,63,.6); }
.combo.on { opacity: 1; animation: pulse .3s ease; }
</style>
</head>
<body>
<div class="app" id="app"></div>
<template id="mission">
  <div class="hud">
    <span class="pill">⏱ <b id="time">20</b>s</span>
    <span class="pill">🐱 <b id="score">0</b><span id="scoreMax">/12</span></span>
  </div>
  <div class="bar"><div id="timeBar" style="width:100%"></div></div>
  <div class="arena roof" id="arena">
    <div class="moon"></div><div class="skyline"></div><div class="combo" id="combo"></div>
  </div>
  <button class="btn" id="startBtn">🐾 Yakalamaya Başla</button>
  <div class="status" id="status"></div>
</template>

<script src="assets/zy11.js"></script>
<script>
let ARC = null, TARGET = 12, SECONDS = 20; const CATS = ['🐱','🐈','😼','🙀','🐈‍⬛'];
let arena, timeEl, scoreEl, bar, startBtn, statusEl, comboEl;
let running = false, score = 0, left = SECONDS, tick = null, spawnT = null, combo = 0, lastHit = 0, caughtCats = 0;

function init(arc) {
  if (arc !== undefined) ARC = arc;
  TARGET = ARC ? Infinity : 12; SECONDS = ARC ? 30 : 20;
  arena = ZY.$('#arena'); timeEl = ZY.$('#time'); scoreEl = ZY.$('#score'); bar = ZY.$('#timeBar');
  startBtn = ZY.$('#startBtn'); statusEl = ZY.$('#status'); comboEl = ZY.$('#combo');
  stop(); score = 0; left = SECONDS; hud();
  ZY.$('#scoreMax').textContent = ARC ? '' : '/12';
  ZY.arenaMsg(arena, '😼', ARC ? '30 saniye, sonsuz kedi!' : 'Hırsız kedi çatılarda!', 'Kedilere dokun, 💣 bombalardan uzak dur');
  startBtn.style.display = ''; startBtn.disabled = false; startBtn.textContent = '🐾 Yakalamaya Başla';
  startBtn.onclick = start; statusEl.textContent = '';
}
function hud() { timeEl.textContent = left; scoreEl.textContent = ARC ? score : Math.min(score, TARGET); bar.style.width = (left / SECONDS * 100) + '%'; }
function stop() { running = false; clearInterval(tick); clearTimeout(spawnT); arena && arena.querySelectorAll('.target').forEach(t => t.remove()); }

async function start() {
  startBtn.disabled = true; ZY.arenaMsg(arena);
  score = 0; left = SECONDS; combo = 0; caughtCats = 0; hud();
  await ZY.countdown(arena);
  running = true; startBtn.style.display = 'none';
  tick = setInterval(() => { left--; hud(); if (left <= 3 && left > 0) ZY.sfx.tick(); if (left <= 0) { if (ARC) return arcadeOver('⌛', 'Süre doldu!'); lose('⌛', 'Süre bitti, zanlı kaçtı!', score + '/' + TARGET + ' kedi yakaladın'); } }, 1000);
  spawn();
}

function spawn() {
  if (!running) return;
  const r = Math.random(), type = r < 0.2 ? 'bomb' : r < 0.28 ? 'heart' : 'cat';
  const life = type === 'bomb' ? 1400 : Math.round(650 + (left / SECONDS) * 350);
  const t = document.createElement('button');
  t.className = 'target ' + type;
  t.style.setProperty('--life', life + 'ms');
  t.innerHTML = '<span>' + (type === 'bomb' ? '💣' : type === 'heart' ? '💛' : CATS[Math.floor(Math.random() * CATS.length)]) + '</span>';
  const W = arena.clientWidth, H = arena.clientHeight - 60;
  const x = 36 + Math.random() * (W - 72), y = 40 + Math.random() * (H - 50);
  t.style.left = x + 'px'; t.style.top = y + 'px';
  const gone = setTimeout(() => { t.remove(); if (type !== 'bomb') combo = 0; }, life);
  t.addEventListener('pointerdown', e => {
    e.preventDefault(); if (!running) return;
    clearTimeout(gone); t.remove();
    const rect = arena.getBoundingClientRect();
    if (type === 'bomb') {
      ZY.burst(rect.left + x, rect.top + y, { colors: ['#ff4d5e', '#ff8a3d', '#ffd23f', '#333'], count: 40, speed: 8 });
      ZY.sfx.bad(); ZY.buzz(200); ZY.shake(arena);
      if (ARC) return arcadeOver('💥', 'BOOM!');
      return lose('💥', 'BOOM! Bombaya bastın.', 'Baştan başla');
    }
    const now = performance.now(); combo = now - lastHit < 900 ? combo + 1 : 1; lastHit = now;
    const pts = type === 'heart' ? 2 : 1; score += pts; caughtCats++; hud();
    ZY.burst(rect.left + x, rect.top + y, { colors: type === 'heart' ? ['#ffd23f', '#fff'] : ['#33e1ff', '#ff4d9d', '#fff'], count: 16 });
    ZY.floatText(arena, x, y, '+' + pts);
    ZY.beep(520 + combo * 60, 0.08, 'triangle'); ZY.buzz(15);
    if (combo >= 3) { comboEl.textContent = '🔥 KOMBO x' + combo; comboEl.classList.remove('on'); void comboEl.offsetWidth; comboEl.classList.add('on'); }
    else comboEl.classList.remove('on');
    if (score >= TARGET) win();
  });
  arena.appendChild(t);
  spawnT = setTimeout(spawn, 560 + (left / SECONDS) * 380);
}

function arcadeOver(big, text) {
  stop(); comboEl.classList.remove('on');
  ZY.arenaMsg(arena, big, text, score + ' kedi');
  startBtn.style.display = ''; startBtn.disabled = false; startBtn.textContent = '🔁 Tekrar';
  ZY.stat('cats', caughtCats);
  ZY.arcadeEnd(score);
}
function lose(big, text, small) {
  ZY.stat('cats', caughtCats); caughtCats = 0;
  stop(); comboEl.classList.remove('on');
  ZY.arenaMsg(arena, big, text, small);
  startBtn.style.display = ''; startBtn.disabled = false; startBtn.textContent = '🔁 Tekrar Dene';
}

function win() {
  const remaining = left; stop(); comboEl.classList.remove('on'); ZY.stat('cats', caughtCats); caughtCats = 0;
  ZY.arenaMsg(arena, '😼', 'Yakalandı!', 'Gülümsemeleri iade etmeyi reddediyor');
  ZY.complete({ stars: remaining >= 8 ? 3 : remaining >= 4 ? 2 : 1, stats: '🐱 12 kedi · ⏱ ' + remaining + ' sn kala', msg: 'Zanlıyı suçüstü yakaladın!' });
}

ZY.onHidden(() => { if (running) lose('⏸', 'Oyun duraklatıldı', 'Tekrar başlat'); });
ZY.page(1, {
  intro: 'Zanlı hakkında bir süredir gelen şikayetleri değerlendirdik. Kanıtları dikkatle oku — son dosyada sorulacak. 👀',
  evidence: [
    'Zanlı, girdiği her ortamdan bir şeyler çalmakla suçlanıyor. Ancak çaldığı şey ne kolye ne de para — sadece insanların gülümsemesi. Tanıklar "yanına gittim, kalbim eksik döndü" diyor.',
    'Olay yerinde sürekli aynı sahne tekrarlanıyor: biri kötü bir günden bahsediyor, zanlı üç cümle içinde o kişiyi güldürmeyi başarıyor. Bu bir tesadüf değil, bir yetenek.',
    'Çevresindekilerin "iyi ki varsın" cümlesini normalden çok daha sık kurduğu tespit edildi. İpuçları zanlının kendisine işaret ediyor.',
    'Arkadaşları arasında "onunla konuşunca içim rahatlıyor" şeklinde tekrar eden ifadeler var. Bu da bir tür hırsızlık: içindeki huzursuzluğu çalıp yerine iyi bir şey bırakmak.',
  ],
  verdict: 'Zanlı suçlu bulunmuştur. Ama çaldığı her şeyin karşılığında daha fazlasını bıraktığı için dosya "af edilebilir hırsız" kategorisine alınmıştır. 🐾💛',
  mission: { title: '🐾 Hırsız Kediyi Yakala', sub: '20 saniyede 12 kediye dokun. Halka küçülmeden yakala! 💛 kalp +2 sayılır, 💣 bomba oyunu bitirir.', goals: ['Bitir', '4 sn kala', '8 sn kala'] },
  init,
});
</script>
</body>
</html>
