<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#1a1145">
<title>Vaka 10 · Sevimli Kedi — ZY-11</title>
<link rel="stylesheet" href="assets/style.css">
<style>
.cushion { height: 340px; display: grid; place-items: center; touch-action: none; cursor: grab;
  background: radial-gradient(circle at 50% 55%, rgba(255,158,210,.45), transparent 55%), linear-gradient(160deg, #3a1a5e, #1a0f3d); }
.ring { position: absolute; width: 230px; height: 230px; left: 50%; top: 50%; margin: -115px; pointer-events: none; transform: rotate(-90deg); }
.ring circle { fill: none; stroke-width: 12; stroke-linecap: round; }
.ring .bg { stroke: rgba(255,255,255,.08); }
.ring .fg { stroke: url(#lg); transition: stroke-dashoffset .15s linear; filter: drop-shadow(0 0 8px rgba(255,77,157,.8)); }
.kitty { position: relative; font-size: 7rem; line-height: 1; pointer-events: none; transition: transform .2s ease; filter: drop-shadow(0 10px 14px rgba(0,0,0,.45)); }
.kitty.purr { animation: purr .22s ease infinite alternate; }
.kitty.grumpy { transform: scale(1.12); filter: drop-shadow(0 0 22px rgba(255,77,94,.95)); }
@keyframes purr { from { transform: rotate(-3deg) scale(1.02); } to { transform: rotate(3deg) scale(1.06); } }
.pct { position: absolute; bottom: 14px; left: 50%; transform: translateX(-50%); font-family: var(--font-head); font-weight: 800; font-size: 1.3rem; color: #fff; text-shadow: 0 0 12px rgba(255,77,157,.8); }
.warn { position: absolute; top: 14px; left: 50%; transform: translateX(-50%); padding: 5px 14px; border-radius: 999px; background: var(--red); color: #fff; font-family: var(--font-head); font-weight: 700; font-size: .9rem; white-space: nowrap; display: none; box-shadow: 0 0 20px rgba(255,77,94,.7); animation: pulse .5s ease infinite; }
.zzz { position: absolute; font-size: 1.4rem; pointer-events: none; animation: floatUp 1.1s ease-out forwards; transform: translate(-50%, -50%); }
</style>
</head>
<body>
<div class="app" id="app"></div>
<template id="mission">
  <div class="hud"><span class="pill">⏱ <b id="time">30</b>s</span><span class="pill">💗 <b id="lovePill">0</b>%</span></div>
  <div class="arena cushion" id="arena">
    <svg class="ring" viewBox="0 0 230 230"><defs><linearGradient id="lg" x1="0" x2="1"><stop offset="0" stop-color="#ff9ed2"/><stop offset="1" stop-color="#ff4d9d"/></linearGradient></defs>
      <circle class="bg" cx="115" cy="115" r="104"/><circle class="fg" id="ringFg" cx="115" cy="115" r="104" stroke-dasharray="653.5" stroke-dashoffset="653.5"/></svg>
    <div class="warn" id="warn">TRİP ATIYOR! DOKUNMA 😾</div>
    <div class="kitty" id="kitty">😺</div>
    <div class="pct" id="pct">0%</div>
  </div>
  <button class="btn" id="startBtn">😻 Sevmeye Başla</button>
  <div class="status" id="status"></div>
</template>

<script src="assets/zy11.js"></script>
<script>
const SECONDS = 30, C = 653.5;
let arena, kitty, warn, statusEl, love, run = false, grumpy, left, tick, moodT, last, lastPet, acc;

function hud() {
  const v = Math.max(0, Math.min(100, love));
  ZY.$('#ringFg').style.strokeDashoffset = C * (1 - v / 100);
  ZY.$('#pct').textContent = Math.floor(v) + '%'; ZY.$('#lovePill').textContent = Math.floor(v); ZY.$('#time').textContent = left;
}
function stop() { run = false; clearInterval(tick); clearTimeout(moodT); grumpy = false; if (warn) warn.style.display = 'none'; }

function init() {
  arena = ZY.$('#arena'); kitty = ZY.$('#kitty'); warn = ZY.$('#warn'); statusEl = ZY.$('#status');
  stop(); love = 0; left = SECONDS; hud(); kitty.textContent = '😺'; kitty.className = 'kitty';
  const b = ZY.$('#startBtn'); b.style.display = ''; b.disabled = false; b.textContent = '😻 Sevmeye Başla'; b.onclick = start;
  statusEl.textContent = 'Parmağını kedinin üstünde gezdir';
  arena.onpointerdown = e => { e.preventDefault(); last = { x: e.clientX, y: e.clientY }; };
  arena.onpointermove = pet; arena.onpointerleave = () => last = null;
}
async function start() {
  const b = ZY.$('#startBtn'); b.disabled = true;
  await ZY.countdown(arena);
  b.style.display = 'none'; run = true; love = 0; left = SECONDS; lastPet = 0; acc = 0; hud();
  statusEl.className = 'status'; statusEl.textContent = 'Yavaşça sev, mırlamaya başlasın...';
  tick = setInterval(() => {
    left--; hud();
    if (performance.now() - lastPet > 700 && !grumpy) { love = Math.max(0, love - 1); kitty.classList.remove('purr'); hud(); }
    if (left <= 5 && left > 0) ZY.sfx.tick();
    if (left <= 0) lose();
  }, 1000);
  mood();
}
function mood() {
  moodT = setTimeout(() => {
    if (!run) return;
    grumpy = true; kitty.textContent = '😾'; kitty.className = 'kitty grumpy'; warn.style.display = 'block'; ZY.beep(220, .2, 'sawtooth', .08); ZY.buzz(60);
    moodT = setTimeout(() => {
      if (!run) return;
      grumpy = false; kitty.textContent = '😺'; kitty.className = 'kitty'; warn.style.display = 'none';
      statusEl.className = 'status good'; statusEl.textContent = 'Trip bitti, kafasını omzuna yasladı 🥹'; mood();
    }, 1100 + Math.random() * 900);
  }, 2000 + Math.random() * 2500);
}
function pet(e) {
  if (!run) return;
  if (!last) { last = { x: e.clientX, y: e.clientY }; return; }
  const d = Math.hypot(e.clientX - last.x, e.clientY - last.y); last = { x: e.clientX, y: e.clientY };
  const r = arena.getBoundingClientRect(), x = e.clientX - r.left, y = e.clientY - r.top;
  if (Math.hypot(x - r.width / 2, y - r.height / 2) > 115) return;
  if (grumpy) {
    love = Math.max(0, love - d * .07); hud();
    if (Math.random() < .1) { ZY.sfx.bad(); ZY.shake(kitty); statusEl.className = 'status bad'; statusEl.textContent = 'Hıhh! Trip atarken sevilmez 😾'; }
    return;
  }
  lastPet = performance.now();
  love += Math.min(d, 40) * .05; hud();
  kitty.textContent = love > 66 ? '😻' : '😸'; kitty.classList.add('purr');
  acc += d;
  if (acc > 60) { acc = 0; ZY.burst(e.clientX, e.clientY, { count: 4, colors: ['#ff4d9d', '#ff9ed2', '#ffd23f'], shape: 'star', speed: 2.5, up: 2.5 }); if (Math.random() < .35) ZY.beep(900 + Math.random() * 400, .04, 'sine', .06); }
  if (love > 50 && love < 51.5) { statusEl.className = 'status good'; statusEl.textContent = 'Mırr mırr... insan mırlaması tespit edildi 🎶'; }
  if (love >= 100) win();
}
function lose() {
  stop(); kitty.className = 'kitty'; kitty.textContent = '😿';
  statusEl.className = 'status bad'; statusEl.textContent = 'Süre bitti! Sevgi %' + Math.floor(love) + '. Kedi daha fazla ilgi istiyor 🥺';
  const b = ZY.$('#startBtn'); b.style.display = ''; b.disabled = false; b.textContent = '🔁 Tekrar Sev';
}
function win() {
  const rem = left; stop(); love = 100; hud(); kitty.className = 'kitty purr'; kitty.textContent = '😻';
  ZY.burstAt(kitty, { count: 50, colors: ['#ff4d9d', '#ff9ed2', '#ffd23f', '#fff'], shape: 'star', speed: 7 });
  statusEl.className = 'status good'; statusEl.textContent = '⚠️ SEVİMLİLİK ÖLÇÜM SINIRI AŞILDI ⚠️';
  ZY.complete({ stars: rem >= 12 ? 3 : rem >= 5 ? 2 : 1, stats: '⏱ ' + rem + ' sn kala doldu', msg: 'Sevimlilik ölçer patladı! 😻' });
}
ZY.onHidden(() => { if (run) lose(); });

ZY.page(10, {
  intro: 'Son kanıt dosyası. Laboratuvarımız zanlının sevimlilik seviyesini ölçmeye çalıştı. Üç cihaz bozuldu, dördüncüsü "ölçüm sınırı aşıldı" yazıp kendini kapattı.',
  evidence: [
    'Bir şey istediğinde yaptığı "kocaman gözler" bakışına karşı koyabilen tek bir kişi bile tespit edilemedi. Tanıklar "hayır diyecektim ama ağzımdan evet çıktı" diyor.',
    'Mutlu olduğunda çıkardığı sesler kayıtlara "insan mırlaması" olarak geçti. Duyan herkesin yüzünde istemsiz bir gülümseme oluşuyor.',
    'Tıpkı bir kedi gibi: sevgisini kazanmak biraz zaman alabilir ama bir kere kazandın mı, seni seçtiğini her gün belli ediyor. Bazen durduk yere trip atıp sonra kafasını omzuna yaslıyor.',
    'Önceki dokuz dosyadaki tüm "suçlar" (hırsızlık, spastiklik, gotiklik, lolculuk, doymazlık, midesizlik, yürüyememe, uzaylılık, abilik) tek bir gerçeğin yan etkisi olarak değerlendirildi: zanlı fazlasıyla sevimli.',
  ],
  verdict: 'Zanlının sevimliliği ölçülemez olarak kayda geçmiştir. Bu dosya, diğer tüm dosyaların ortak paydasıdır. Son dosyanın kilidi bu vakada saklı. 😻💛',
  mission: { title: '😻 Sevimlilik Ölçer', sub: 'Kediyi sev, halka dolsun! Ama 😾 trip atınca hemen dur, yoksa sevgi düşer. 30 saniyen var.', goals: ['Doldur', '5 sn kala', '12 sn kala'] },
  init,
});
</script>
</body>
</html>
