<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#1a1145">
<title>Vaka 9 · Pisicik Abi — ZY-11</title>
<link rel="stylesheet" href="assets/style.css">
<script data-theme-boot>try{document.documentElement.dataset.theme=JSON.parse(localStorage.getItem("zy11_profile")||"{}").theme||"gece"}catch(e){}</script>
<style>
.phone { max-width: 380px; padding: 0; border-radius: 30px; text-align: left; }
.phone-top { display: flex; align-items: center; gap: 10px; padding: 12px 16px; background: rgba(255,255,255,.07); border-bottom: 1px solid var(--line); }
.phone-top .av { width: 38px; height: 38px; border-radius: 50%; display: grid; place-items: center; font-size: 1.3rem; background: var(--grad-hot); }
.phone-top b { font-family: var(--font-head); font-size: 1rem; display: block; line-height: 1.1; }
.phone-top small { color: var(--lime); font-size: .72rem; font-weight: 700; }
.chat { padding: 14px; min-height: 210px; display: flex; flex-direction: column; gap: 8px; }
.msg { max-width: 84%; padding: 9px 13px; border-radius: 18px 18px 18px 6px; background: #fff; color: #1a1145; font-size: .92rem; line-height: 1.4; animation: msgIn .3s cubic-bezier(.3,1.5,.6,1) both; }
.msg.me { align-self: flex-end; border-radius: 18px 18px 6px 18px; background: var(--grad-hot); color: #fff; }
.msg .who { display: block; font-size: .7rem; font-weight: 800; opacity: .6; margin-bottom: 1px; }
.typing { align-self: flex-start; background: #fff; border-radius: 18px; padding: 10px 14px; display: flex; gap: 4px; }
.typing i { width: 7px; height: 7px; border-radius: 50%; background: #9b8fd0; animation: dot 1s infinite; }
.typing i:nth-child(2) { animation-delay: .15s; } .typing i:nth-child(3) { animation-delay: .3s; }
@keyframes dot { 50% { transform: translateY(-4px); opacity: .4; } }
@keyframes msgIn { from { transform: scale(.6) translateY(10px); opacity: 0; } }
.opts { display: flex; flex-direction: column; gap: 8px; max-width: 380px; margin: 0 auto; }
.opt { text-align: left; padding: 12px 14px; border-radius: 16px; border: 1px solid var(--line); background: var(--surface-2); font-size: .92rem; line-height: 1.4; cursor: pointer; animation: rise .35s ease both; transition: transform .12s, border-color .12s; }
.opt:active { transform: scale(.98); }
.opt.wrong { border-color: var(--red); background: rgba(255,77,94,.14); opacity: .7; }
.meter { display: flex; gap: 6px; justify-content: center; margin-bottom: 12px; }
.meter i { width: 34px; height: 8px; border-radius: 999px; background: rgba(255,255,255,.12); }
.meter i.on { background: var(--grad-hot); box-shadow: var(--glow-pink); }
</style>
</head>
<body>
<div class="app" id="app"></div>
<template id="mission">
  <div class="meter" id="meter"><i></i><i></i><i></i><i></i><i></i></div>
  <div class="hud"><span class="pill">❌ <b id="miss">0</b> yanlış</span></div>
  <div class="arena phone">
    <div class="phone-top"><div class="av" id="av">🙂</div><div><b id="who">Arkadaş</b><small>● çevrimiçi</small></div></div>
    <div class="chat" id="chat"></div>
  </div>
  <div class="opts" id="opts"></div>
  <div class="status" id="status"></div>
</template>

<script src="assets/zy11.js"></script>
<script>
const SCENES = [
  { who: 'Kanka', av: '🥺', text: 'Biri bana bugün çok kaba davrandı, ağlayasım geliyor 😢', opts: [
    { t: 'Hmm, olur öyle. Sen de takma.', why: 'Fazla soğuk! Pisicik önce sarılır.' },
    { t: 'Gel buraya, sarılayım önce 🫂 Sonra adını ver, gerisini ben hallederim 😼', ok: true, reply: 'Hahah tamam, şimdiden daha iyiyim 🥹' },
    { t: 'Ben de çok ağladım bugün aslında, dinle bak...', why: 'Pisicik Abi önce karşısındakini dinler.' } ] },
  { who: 'Okul Arkadaşı', av: '😬', text: 'Arkadaşımla kavga ettim. Ama itiraf edeyim, biraz ben haksızdım...', opts: [
    { t: 'Kesinlikle o haksız, sen hep haklısın!', why: 'Abi tarafı dürüsttür, boş yere hak vermez.' },
    { t: 'Bilmem, kendiniz çözün.', why: 'Bu ne soğukluk! Pisicik umursar.' },
    { t: 'Seni çok seviyorum ama burada sen haksızsın canım. Git bir özür dile, sonra beraber çiğköfte yeriz 🌯', ok: true, reply: 'Peki abi... (çiğköfte sözü kaydedildi)' } ] },
  { who: 'Grup Sohbeti', av: '👥', text: 'Bu akşam ne yapıyoruz? 2 saattir kimse karar veremiyor 🙃', opts: [
    { t: 'Tamam, şöyle yapıyoruz: 8\'de buluşuyoruz, önce yemek, sonra yürüyüş. İtiraz eden bulaşığı yıkar 😼', ok: true, reply: 'Kaptan geldi! Herkes onayladı 🫡' },
    { t: 'Bana fark etmez, siz bilirsiniz 🤷‍♀️', why: 'Pisicik boyutunda bir kaptan dümene geçer!' },
    { t: '*sohbeti sessize alır*', why: 'Grubun kaptanı gemiyi terk etmez.' } ] },
  { who: 'Kuzen', av: '😞', text: 'Sınavdan kötü not aldım, ben hiçbir şeyi başaramıyorum galiba...', opts: [
    { t: 'Ya evet, biraz daha çalışman lazımdı.', why: 'Doğru olabilir ama önce moral! Tatlı taraf nerede?' },
    { t: 'Bir not seni tanımlamaz. Sen bildiğim en zeki insanlardan birisin. Yarın beraber çalışalım, ben de geliyorum 💪', ok: true, reply: 'Gerçekten mi? Tamam, yarın kütüphane! 📚' },
    { t: 'Boşver, okul önemli değil zaten.', why: 'Abi tavsiyesi gerçekçi olur, kaçamak değil.' } ] },
  { who: 'Can Dostun', av: '🤗', text: 'Sen bugün biraz durgun gibisin... İyi misin?', opts: [
    { t: 'İyiyim iyiyim, sen asıl nasılsın? Senin sorunu çözelim 😼', why: 'Tipik Pisicik Abi hatası! Kanıt #4: bazen sıra ona da gelmeli.' },
    { t: 'Yok bir şey, boşver.', why: 'Kapıyı kapatma, seni seven biri soruyor.' },
    { t: 'Aslında... evet, zor bir gündü. Anlatsam dinler misin? 🥺', ok: true, reply: 'Tabii ki! Bu sefer sıra bende, gel bakalım 🫂' } ] },
];
let chat, opts, statusEl, idx, miss, session = 0;
const add = (html, cls) => { const d = document.createElement('div'); d.className = cls; d.innerHTML = html; chat.appendChild(d); return d; };

function init() { chat = ZY.$('#chat'); opts = ZY.$('#opts'); statusEl = ZY.$('#status'); idx = 0; miss = 0; session++; ZY.$('#miss').textContent = 0; show(); }
async function show() {
  const my = session, s = SCENES[idx];
  [...ZY.$('#meter').children].forEach((m, i) => m.classList.toggle('on', i < idx));
  ZY.$('#who').textContent = s.who; ZY.$('#av').textContent = s.av;
  chat.innerHTML = ''; opts.innerHTML = ''; statusEl.textContent = '';
  const ty = add('<i></i><i></i><i></i>', 'typing'); await ZY.wait(800); if (my !== session) return; ty.remove();
  add('<span class="who">' + s.who + '</span>' + s.text, 'msg'); ZY.beep(780, .06, 'sine', .08);
  await ZY.wait(300);
  ZY.shuffle(s.opts.slice()).forEach((o, k) => {
    const b = document.createElement('button'); b.className = 'opt'; b.style.animationDelay = (k * .07) + 's'; b.textContent = o.t;
    b.onclick = () => choose(o, b); opts.appendChild(b);
  });
}
async function choose(o, b) {
  if (!o.ok) {
    miss++; ZY.$('#miss').textContent = miss; b.classList.add('wrong'); b.disabled = true; ZY.sfx.bad(); ZY.shake(b);
    statusEl.className = 'status bad'; statusEl.textContent = '✗ ' + o.why; return;
  }
  const my = session;
  opts.innerHTML = ''; statusEl.className = 'status good'; statusEl.textContent = '✓ Tam bir Pisicik Abi cevabı!';
  add('<span class="who">Pisicik Abi 😼</span>' + o.t, 'msg me'); ZY.sfx.good(); ZY.burstAt(chat, { count: 14, colors: ['#ff4d9d', '#ff8a3d', '#fff'] });
  await ZY.wait(700); if (my !== session) return;
  const ty = add('<i></i><i></i><i></i>', 'typing'); await ZY.wait(700); if (my !== session) return; ty.remove();
  add('<span class="who">' + SCENES[idx].who + '</span>' + o.reply, 'msg');
  await ZY.wait(1300); if (my !== session) return;
  idx++;
  if (idx >= SCENES.length) {
    [...ZY.$('#meter').children].forEach(m => m.classList.add('on'));
    ZY.complete({ stars: miss === 0 ? 3 : miss <= 2 ? 2 : 1, stats: '❌ ' + miss + ' yanlış cevap', msg: '😼 Sertifikalı Pisicik Abi! Pati kadar yumuşak, kaya kadar sağlam.' });
  } else show();
}

ZY.page(9, {
  intro: 'Zanlıda iki farklı kişilik tespit edildi: dışarıdan minik, tatlı bir pisicik; içeride "kim üzdü seni, söyle bana" diyen koca bir abi.',
  evidence: [
    'Görünüşte en sevimli, en minik kişi. Ama arkadaşlarından biri üzüldüğünde ses tonu bir anda değişiyor: "Adını ver, gerisini ben hallederim."',
    'Birisi dertlendiğinde önce sarılıyor, sonra gerçekçi bir abi tavsiyesi veriyor: "Seni seviyorum ama burada sen haksızsın." Şefkat ve dürüstlük aynı pakette.',
    'Grupta kimse karar veremediğinde "tamam, şöyle yapıyoruz" diyerek dümene geçen kişi o. Pisicik boyutunda bir kaptan.',
    'Kendisi zor bir gün geçirse bile önce başkalarına "sen iyi misin?" diye soruyor. Arkadaşları, sıranın ona da geldiğini hatırlatmak zorunda kalıyor.',
  ],
  verdict: 'Zanlı resmi olarak "Pisicik Abi" ilan edilmiştir — pati kadar yumuşak, kaya kadar sağlam. Dosya "dokunanı yakar, sevenini korur" kategorisine alınmıştır. 😼🛡️',
  mission: { title: '🛡️ Pisicik Abi Gibi Konuş', sub: 'Arkadaşlar dertleriyle yazıyor. Hem tatlı 🐱 hem sağlam 💪 olan cevabı seç.', goals: ['Bitir', 'En fazla 2 yanlış', 'Hepsi doğru'] },
  init,
});
</script>
</body>
</html>
