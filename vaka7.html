<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#1a1145">
<title>Vaka 7 · Yolda Yürüyemeyen Kız — ZY-11</title>
<link rel="stylesheet" href="assets/style.css">
<script data-theme-boot>try{document.documentElement.dataset.theme=JSON.parse(localStorage.getItem("zy11_profile")||"{}").theme||"gece"}catch(e){}</script>
<style>
.street { height: 380px; max-width: 340px; background: linear-gradient(90deg, #3a2f6b 0 9%, #2a2350 9% 91%, #3a2f6b 91%); touch-action: none; }
.street .lanes { position: absolute; inset: 0 9%; background:
  linear-gradient(90deg, transparent calc(33.33% - 2px), rgba(255,255,255,.4) calc(33.33% - 2px) calc(33.33% + 2px), transparent calc(33.33% + 2px)),
  linear-gradient(90deg, transparent calc(66.66% - 2px), rgba(255,255,255,.4) calc(66.66% - 2px) calc(66.66% + 2px), transparent calc(66.66% + 2px));
  -webkit-mask: repeating-linear-gradient(180deg, #000 0 26px, transparent 26px 48px); mask: repeating-linear-gradient(180deg, #000 0 26px, transparent 26px 48px);
  -webkit-mask-position: 0 var(--off, 0); mask-position: 0 var(--off, 0); }
.street .lamp { position: absolute; width: 8%; height: 40px; font-size: 1.2rem; text-align: center; }
.walker { position: absolute; bottom: 16px; width: 60px; margin-left: -30px; text-align: center; font-size: 2.5rem; line-height: 1; transition: left .13s cubic-bezier(.3,1.4,.6,1); z-index: 3; filter: drop-shadow(0 0 10px rgba(166,255,77,.7)); }
.walker.hit { animation: wobble .5s ease; }
.walker.inv { opacity: .5; }
@keyframes wobble { 25% { transform: rotate(-30deg); } 75% { transform: rotate(30deg); } }
.obs { position: absolute; top: 0; width: 60px; margin-left: -30px; text-align: center; font-size: 2.2rem; line-height: 1; will-change: transform; filter: drop-shadow(0 6px 6px rgba(0,0,0,.5)); }
.bubble { position: absolute; bottom: 70px; transform: translateX(-50%); background: #fff; color: #1a1145; font-family: var(--font-head); font-weight: 700; font-size: .85rem; padding: 3px 10px; border-radius: 12px; white-space: nowrap; animation: floatUp 1s ease forwards; z-index: 4; }
.home { position: absolute; top: 8px; left: 50%; transform: translateX(-50%); font-size: 1.6rem; opacity: 0; transition: opacity .4s; z-index: 2; }
</style>
</head>
<body>
<div class="app" id="app"></div>
<template id="mission">
  <div class="hud"><span class="pill"><span id="distLbl">🏠</span> <b id="dist">300</b> m</span><span class="pill" id="lives">❤️❤️❤️</span></div>
  <div class="bar"><div id="prog"></div></div>
  <div class="arena street" id="arena"><div class="lanes" id="lanes"></div><div class="home" id="home">🏠</div><div class="walker" id="walker">🚶‍♀️</div></div>
  <div class="ctrl-row"><button class="ctrl" id="lBtn">◀</button><button class="ctrl" id="rBtn">▶</button></div>
  <button class="btn cool" id="startBtn">🚶‍♀️ Yürüyüşe Başla</button>
  <div class="status" id="status"></div>
</template>

<script src="assets/zy11.js"></script>
<script>
let ARC = null, DIST = 300;
const OBS = [
  { e: '🪧', m: 'Direğe çarptı! "Pardon" dedi direğe.' }, { e: '🕳️', m: 'Çukura bastı! "Yer beni itti."' },
  { e: '🚲', m: 'Bisiklet! Son anda zıpladı... olmadı.' }, { e: '🐈', m: 'Kedi gördü, sevmek için durdu 🐈' },
  { e: '🚧', m: 'Kazı alanı! Konuşmaya dalmıştı.' }, { e: '🛴', m: 'Scooter! "Ben de binsem mi?"' },
];
let arena, walker, statusEl, lane, run = false, obs = [], walked, lives, last, spawnT, raf, inv, off;
const laneX = l => (9 + (l + .5) * 82 / 3) + '%';

function init(arc) {
  if (arc !== undefined) ARC = arc; DIST = ARC ? Infinity : 300;
  arena = ZY.$('#arena'); walker = ZY.$('#walker'); statusEl = ZY.$('#status');
  run = false; cancelAnimationFrame(raf); obs.forEach(o => o.el.remove()); obs = [];
  lane = 1; walked = 0; lives = 3; walker.style.left = laneX(1); walker.textContent = '🚶‍♀️'; ZY.$('#home').style.opacity = 0; hud();
  ZY.arenaMsg(arena, '🚶‍♀️', 'Zanlıyı eve götür', 'Şerit değiştirmek için sağa/sola dokun');
  const b = ZY.$('#startBtn'); b.style.display = ''; b.disabled = false; b.textContent = '🚶‍♀️ Yürüyüşe Başla'; b.onclick = start;
  statusEl.textContent = '';
  arena.onpointerdown = e => { e.preventDefault(); const r = arena.getBoundingClientRect(); shift(e.clientX - r.left < r.width / 2 ? -1 : 1); };
  ZY.$('#lBtn').onpointerdown = e => { e.preventDefault(); shift(-1); };
  ZY.$('#rBtn').onpointerdown = e => { e.preventDefault(); shift(1); };
}
function shift(d) { if (!run) return; const n = Math.max(0, Math.min(2, lane + d)); if (n !== lane) { lane = n; walker.style.left = laneX(lane); ZY.beep(500, .03, 'triangle', .05); } }
document.addEventListener('keydown', e => { if (e.key === 'ArrowLeft') shift(-1); if (e.key === 'ArrowRight') shift(1); });
function hud() {
  ZY.$('#dist').textContent = ARC ? Math.floor(walked) : Math.max(0, Math.ceil(DIST - walked));
  ZY.$('#distLbl').textContent = ARC ? '📏' : '🏠';
  ZY.$('#lives').textContent = '❤️'.repeat(lives) + '🖤'.repeat(3 - lives);
  ZY.$('#prog').style.width = (ARC ? (walked % 100) : Math.min(100, walked / DIST * 100)) + '%';
}
async function start() {
  const b = ZY.$('#startBtn'); b.disabled = true; ZY.arenaMsg(arena);
  await ZY.countdown(arena);
  b.style.display = 'none'; run = true; last = performance.now(); spawnT = 0; inv = 0; off = 0;
  statusEl.className = 'status'; statusEl.textContent = '"Ya bak ne diyeceğim..." 🗣️';
  raf = requestAnimationFrame(loop);
}
function spawn() {
  const speed = 160 + Math.min(walked, 700) * .9;
  const n = Math.random() < Math.min(ARC ? .62 : .5, walked / 380) ? 2 : 1;
  ZY.shuffle([0, 1, 2]).slice(0, n).forEach(l => {
    const t = OBS[Math.floor(Math.random() * OBS.length)], el = document.createElement('div');
    el.className = 'obs'; el.textContent = t.e; el.style.left = laneX(l); arena.appendChild(el);
    obs.push({ el, l, y: -50, v: speed, t });
  });
}
function bubble(txt) { const b = document.createElement('div'); b.className = 'bubble'; b.textContent = txt; b.style.left = walker.style.left; arena.appendChild(b); setTimeout(() => b.remove(), 1000); }
function loop(t) {
  if (!run) return;
  const dt = Math.min(.05, (t - last) / 1000); last = t;
  walked += (12 + Math.min(walked, 600) * (ARC ? .02 : .03)) * dt;
  off = (off + (160 + Math.min(walked, 700) * .9) * dt) % 48; ZY.$('#lanes').style.setProperty('--off', off + 'px');
  inv = Math.max(0, inv - dt); walker.classList.toggle('inv', inv > 0);
  spawnT -= dt; if (spawnT <= 0 && walked < DIST - 25) { spawn(); spawnT = Math.max(ARC ? .42 : .55, 1.1 - walked / 500); }
  if (walked > DIST - 40) ZY.$('#home').style.opacity = 1;
  const H = arena.clientHeight, wy = H - 60, rect = arena.getBoundingClientRect();
  for (let i = obs.length - 1; i >= 0; i--) {
    const o = obs[i]; o.y += o.v * dt; o.el.style.transform = 'translateY(' + o.y + 'px)';
    if (!inv && o.l === lane && o.y > wy - 34 && o.y < wy + 24) {
      o.el.remove(); obs.splice(i, 1); lives--; inv = 1.1; hud();
      walker.classList.remove('hit'); void walker.offsetWidth; walker.classList.add('hit');
      ZY.sfx.bad(); ZY.burst(rect.left + walker.offsetLeft, rect.top + wy, { count: 14, colors: ['#ff4d5e', '#ffd23f'] });
      statusEl.className = 'status bad'; statusEl.textContent = o.t.m; bubble(o.t.e === '🐈' ? 'pisi pisi 🥺' : 'ayy!');
      if (lives <= 0) return end(false);
    } else if (o.y > H + 20) { o.el.remove(); obs.splice(i, 1); }
  }
  hud();
  if (walked >= DIST) return end(true);
  raf = requestAnimationFrame(loop);
}
function end(won) {
  run = false; cancelAnimationFrame(raf); obs.forEach(o => o.el.remove()); obs = [];
  const b = ZY.$('#startBtn');
  ZY.stat('meters', Math.floor(walked));
  if (ARC) { ZY.arenaMsg(arena, '🤕', Math.floor(walked) + ' metre!', 'Zanlı yine yerde ama gülüyor'); b.style.display = ''; b.disabled = false; b.textContent = '🔁 Tekrar'; return ZY.arcadeEnd(walked); }
  if (!won) { ZY.arenaMsg(arena, '🤕', 'Zanlı yine yerde', 'Ama gülüyor. Tekrar dene!'); b.style.display = ''; b.disabled = false; b.textContent = '🔁 Tekrar Dene'; return; }
  walker.textContent = '🏃‍♀️'; ZY.arenaMsg(arena, '🏠', 'Eve vardı!', lives === 3 ? 'Tarihte ilk kez sıfır hasar!' : 'Birkaç tökezleme, ama sağ salim');
  ZY.complete({ stars: lives, stats: '❤️ ' + lives + ' can · 🚶‍♀️ 300 m', msg: lives === 3 ? 'Kusursuz eskort! Hiç tökezlemedi 🏅' : 'Kolundan hiç bırakmadın 💛' });
}
ZY.onHidden(() => { if (run) end(false); });

ZY.page(7, {
  intro: 'Ekiplerimiz zanlıyı bir hafta boyunca sokakta takip etti. A noktasından B noktasına düz bir çizgide gidebildiği tek bir an bile kaydedilemedi.',
  evidence: [
    'Konuşurken yürümeyi unuttuğu tespit edildi: hikâyenin heyecanlı yerinde olduğu yerde duruyor, el kol hareketleriyle anlatıyor, sonra "nerede kalmıştık" diyerek yanlış yöne yürüyor.',
    'Tamamen düz bir kaldırımda, hiçbir engel yokken tökezlediği kamera kayıtlarına geçti. Zanlının ifadesi: "Yer beni itti."',
    'Yol üstündeki her kedi bir durak noktası sayılıyor. Beş dakikalık yol, kedi yoğunluğuna bağlı olarak yirmi dakikaya kadar uzayabiliyor.',
    'Arkadaşlarının onu direklerden, çukurlardan ve bisikletlerden korumak için kolundan tutarak yürüdüğü görüldü. Zanlı bunu "eskort hizmeti" olarak adlandırıyor.',
  ],
  verdict: 'Yürüme yeteneği "deneysel" olarak sınıflandırılmıştır. Ama her tökezlemeden sonra en çok gülen yine kendisi olduğu için dosya "neşeli kaza" kategorisine alınmıştır. Tedbir: daima kolundan tutun. 💫',
  mission: { title: '🚧 Eskort Hizmeti', sub: 'Direk 🪧, çukur 🕳️, bisiklet 🚲 ve kedilerden 🐈 kaçırarak zanlıyı eve ulaştır. 3 canın var.', goals: ['Eve var', '1 tökezleme', 'Sıfır hasar'] },
  init,
});
</script>
</body>
</html>
