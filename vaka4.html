<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#1a1145">
<title>Vaka 4 · Lolcu Köpek — ZY-11</title>
<link rel="stylesheet" href="assets/style.css">
<script data-theme-boot>try{document.documentElement.dataset.theme=JSON.parse(localStorage.getItem("zy11_profile")||"{}").theme||"gece"}catch(e){}</script>
<style>
.monitor { height: 300px; display: grid; place-items: center; cursor: pointer; }
.monitor .clock { position: absolute; top: 12px; left: 14px; font-family: var(--font-mono); font-weight: 700; font-size: .8rem; color: var(--cyan); text-shadow: 0 0 8px var(--cyan); }
.orb {
  width: 170px; height: 170px; border-radius: 50%; display: grid; place-items: center; text-align: center;
  font-family: var(--font-head); font-weight: 800; font-size: 1.2rem; line-height: 1.1; color: #fff; pointer-events: none;
  background: radial-gradient(circle at 35% 30%, #5a4aa8, #2a1d6b); box-shadow: 0 0 0 8px rgba(255,255,255,.06), 0 14px 30px rgba(0,0,0,.5);
  transition: transform .12s ease, background .12s ease, box-shadow .12s ease;
}
.orb .e { font-size: 3.2rem; display: block; margin-bottom: 2px; }
.orb small { display: block; font-family: var(--font-body); font-weight: 600; font-size: .72rem; color: rgba(255,255,255,.7); }
.monitor.go .orb { background: radial-gradient(circle at 35% 30%, #a6ff4d, #2fa75a); transform: scale(1.12); box-shadow: 0 0 0 12px rgba(166,255,77,.2), 0 0 60px rgba(166,255,77,.7); }
.monitor.decoy .orb { background: radial-gradient(circle at 35% 30%, #ffe066, #d18a00); transform: scale(1.05); box-shadow: 0 0 0 12px rgba(255,210,63,.2), 0 0 50px rgba(255,210,63,.6); }
.monitor.fail .orb { background: radial-gradient(circle at 35% 30%, #ff7a86, #b0182a); box-shadow: 0 0 60px rgba(255,77,94,.7); }
.monitor.go::before { content: ''; position: absolute; inset: 0; background: radial-gradient(circle, rgba(166,255,77,.2), transparent 70%); }
.times { display: flex; gap: 6px; justify-content: center; flex-wrap: wrap; min-height: 30px; margin-bottom: 10px; }
.times span { font-family: var(--font-mono); font-weight: 700; font-size: .78rem; padding: 4px 9px; border-radius: 8px; background: rgba(166,255,77,.14); color: var(--lime); border: 1px solid rgba(166,255,77,.35); animation: popIn .3s ease; }
.times span.slow { background: rgba(255,210,63,.12); color: var(--yellow); border-color: rgba(255,210,63,.35); }
@keyframes popIn { from { transform: scale(0); } }
</style>
</head>
<body>
<div class="app" id="app"></div>
<template id="mission">
  <div class="hud"><span class="pill">✅ <b id="ok">0</b><span id="okMax">/5</span></span><span class="pill">📊 ort. <b id="avg">–</b></span></div>
  <div class="times" id="times"></div>
  <div class="arena monitor" id="arena"><div class="clock">03:00 AM</div><div class="orb" id="orb"><span><span class="e">🎮</span>Hazır mısın?</span></div></div>
  <button class="btn cool" id="startBtn">🐶 Teste Başla</button>
  <div class="status" id="status"></div>
</template>

<script src="assets/zy11.js"></script>
<script>
let ARC = null, TARGET = 5;
let arena, orb, statusEl, timesEl, ok, state, wT, aT, shownAt, list;
function setOrb(cls, e, t, s) { arena.className = 'arena monitor ' + cls; orb.innerHTML = '<span><span class="e">' + e + '</span>' + t + (s ? '<small>' + s + '</small>' : '') + '</span>'; }

function init(arc) {
  if (arc !== undefined) ARC = arc; TARGET = ARC ? Infinity : 5;
  arena = ZY.$('#arena'); orb = ZY.$('#orb'); statusEl = ZY.$('#status'); timesEl = ZY.$('#times');
  clearTimeout(wT); clearTimeout(aT); state = 'idle'; ok = 0; list = [];
  ZY.$('#ok').textContent = 0; ZY.$('#okMax').textContent = ARC ? '' : '/5'; ZY.$('#avg').textContent = '–'; timesEl.innerHTML = ''; statusEl.textContent = '';
  setOrb('', '🎮', 'Hazır mısın?', 'Yeşil 🐶 = dokun · Sarı 🐱 = dokunma');
  const b = ZY.$('#startBtn'); b.style.display = ''; b.disabled = false; b.onclick = () => { b.style.display = 'none'; next(); };
  arena.onpointerdown = hit;
}

function next() {
  clearTimeout(wT); clearTimeout(aT); state = 'wait';
  setOrb('', '🌙', 'Bekle...', 'herkes uyuyor');
  wT = setTimeout(() => {
    if (Math.random() < 0.3) { state = 'decoy'; setOrb('decoy', '🐱', 'DOKUNMA!'); ZY.beep(300, .1, 'sine'); wT = setTimeout(() => state === 'decoy' && next(), 850); }
    else {
      state = 'go'; shownAt = performance.now(); setOrb('go', '🐶', 'TIKLA!'); ZY.beep(980, .08, 'square', .08);
      aT = setTimeout(() => { if (state === 'go') { if (ARC) return arcFail('🐢', 'Kaçırdın!'); statusEl.className = 'status bad'; statusEl.textContent = 'Kaçırdın! Maç kaybedildi, tekrar 🐾'; next(); } }, ARC ? Math.max(380, 900 - ok * 30) : 900);
    }
  }, 1000 + Math.random() * 2200);
}

function hit(e) {
  e.preventDefault();
  if (state === 'go') {
    clearTimeout(aT);
    const ms = Math.round(performance.now() - shownAt);
    ok++; list.push(ms); ZY.$('#ok').textContent = ok;
    ZY.$('#avg').textContent = Math.round(list.reduce((a, b) => a + b, 0) / list.length) + 'ms';
    timesEl.insertAdjacentHTML('beforeend', '<span class="' + (ms > 420 ? 'slow' : '') + '">' + ms + 'ms</span>'); while (timesEl.children.length > 8) timesEl.firstChild.remove();
    ZY.burstAt(orb, { count: 18, colors: ['#a6ff4d', '#fff', '#33e1ff'] }); ZY.beep(600 + ok * 90, .1, 'triangle'); ZY.buzz(20);
    statusEl.className = 'status good'; statusEl.textContent = ms < 300 ? 'Gece 3 refleksi! 🔥' : 'Tam zamanında! 🐶';
    if (ok >= TARGET) return finish();
    state = 'pause'; setOrb('go', '✅', ms + ' ms'); wT = setTimeout(next, 700);
  } else if (state === 'wait' || state === 'decoy') {
    clearTimeout(wT);
    const decoy = state === 'decoy'; state = 'pause';
    if (ARC) return arcFail(decoy ? '🙀' : '😅', decoy ? 'TUZAK!' : 'ERKEN!');
    ZY.sfx.bad(); ZY.shake(arena);
    setOrb('fail', decoy ? '🙀' : '😅', decoy ? 'TUZAK!' : 'ERKEN!');
    statusEl.className = 'status bad'; statusEl.textContent = decoy ? 'Kediye dokundun! Bu tur baştan.' : 'Sabırsız köpek! Bu tur baştan.';
    wT = setTimeout(next, 900);
  }
}

function arcFail(e, t) {
  clearTimeout(wT); clearTimeout(aT); state = 'done'; ZY.sfx.bad(); ZY.shake(arena);
  setOrb('fail', e, t, ok + ' tur');
  const b = ZY.$('#startBtn'); b.style.display = ''; b.textContent = '🔁 Tekrar';
  b.onclick = () => { init(); b.style.display = 'none'; next(); };
  const avg = list.length ? Math.round(list.reduce((a, c) => a + c, 0) / list.length) : 0;
  ZY.arcadeEnd(ok, list.length ? '📊 Ortalama ' + avg + ' ms' : '');
}
function finish() {
  state = 'done';
  const avg = Math.round(list.reduce((a, b) => a + b, 0) / list.length);
  setOrb('', '🏆', avg + ' ms', 'ortalama');
  ZY.complete({
    stars: avg < 330 ? 3 : avg < 450 ? 2 : 1,
    stats: '📊 Ortalama ' + avg + ' ms · en iyi ' + Math.min(...list) + ' ms',
    msg: avg < 330 ? 'Rütbe: Challenger Köpek 🐶👑' : avg < 450 ? 'Rütbe: Elmas Köpek 💎' : 'Rütbe: Gümüş Köpek, ama kalbi altın 💛',
  });
}

ZY.onHidden(() => { if (state !== 'idle' && state !== 'done') init(); });
ZY.page(4, {
  intro: 'Zanlının "lolcu köpek" olarak anılmasının sebepleri araştırıldı. Gerçek bir lolcu köpek kadar hızlı mısın?',
  evidence: [
    'Zanlının lolcu köpek kimliği en çok gecenin 3\'ünde ortaya çıkıyor. Herkes uyurken o hâlâ LoL oynuyor — tıpkı gece nöbeti tutan sadık bir bekçi köpeği gibi.',
    'Aynı esprisini üç farklı ortamda tekrar patlatıp her seferinde ilk kez söylüyormuş gibi kendi kendine gülmesi kayıtlara geçti. Bu davranış "lolcu döngü" olarak işlendi.',
    'Zanlı, tıpkı sadık bir köpek gibi güvenilir, sevgi dolu ve bitmek bilmeyen bir enerjiye sahip. Yanına kim giderse gitsin, görünmez bir kuyruğu varmış gibi karşılıyor.',
    'Bir gece yarısı LoL oynarken attığı çığlık binadaki herkesi uyandırmış. Kimse kızamamış, çünkü sesindeki heyecan tam bir lolcu köpek coşkusuydu.',
  ],
  verdict: 'Zanlı resmi olarak "Lolcu Köpek" ilan edilmiştir — gece yarısı enerjisi, bulaşıcı kahkahaları ve sadık sevgisiyle bu unvanı hak etmiştir. 🐶🎮',
  mission: { title: '🐶 Gece 3 Refleks Testi', sub: 'Daire yeşile dönüp 🐶 TIKLA! yazınca dokun. Sarı 🐱 tuzaktır! 5 başarılı tur.', goals: ['Bitir', 'Ort. 450 ms altı', 'Ort. 330 ms altı'] },
  init,
});
</script>
</body>
</html>
