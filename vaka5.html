<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#1a1145">
<title>Vaka 5 · Doymayan — ZY-11</title>
<link rel="stylesheet" href="assets/style.css">
<script data-theme-boot>try{document.documentElement.dataset.theme=JSON.parse(localStorage.getItem("zy11_profile")||"{}").theme||"gece"}catch(e){}</script>
<style>
.maze-arena { padding: 12px; display: flex; justify-content: center; }
.maze { position: relative; display: grid; touch-action: none; border-radius: 12px; overflow: hidden; }
.cell { width: var(--c); height: var(--c); }
.cell.w { background: linear-gradient(135deg, #3a2a8a, #24185e); box-shadow: inset 0 0 0 1px rgba(255,255,255,.05); }
.cell.p { background: rgba(255,255,255,.04); }
.cell.t { background: rgba(255,138,61,.22); }
.tok { position: absolute; width: var(--c); height: var(--c); display: grid; place-items: center; font-size: calc(var(--c) * .9); line-height: 1; transition: left .1s ease, top .1s ease; pointer-events: none; }
.tok.me { z-index: 3; filter: drop-shadow(0 0 6px rgba(255,210,63,.9)); }
.tok.goal.locked { filter: grayscale(1) opacity(.45); }
.tok.goal:not(.locked) { animation: pulse 1s ease infinite; filter: drop-shadow(0 0 8px rgba(166,255,77,.9)); }
.bag { display: flex; gap: 8px; justify-content: center; margin-bottom: 12px; flex-wrap: wrap; }
.bag .pill { opacity: .45; transition: all .3s ease; }
.bag .pill.got { opacity: 1; background: rgba(166,255,77,.15); border-color: rgba(166,255,77,.5); color: var(--lime); }
.dpad { display: grid; grid-template-columns: repeat(3, 64px); grid-template-rows: repeat(2, 56px); gap: 8px; justify-content: center; margin: 4px 0 8px; }
.dpad .ctrl { width: 64px; height: 56px; }
.dpad [data-d="u"] { grid-column: 2; } .dpad [data-d="l"] { grid-column: 1; grid-row: 2; } .dpad [data-d="d"] { grid-column: 2; grid-row: 2; } .dpad [data-d="r"] { grid-column: 3; grid-row: 2; }
</style>
</head>
<body>
<div class="app" id="app"></div>
<template id="mission">
  <div class="bag"><span class="pill" id="bC">🍗 Popeyes</span><span class="pill" id="bM">🥤 Monster</span><span class="pill" id="bG">🌯 Çiğköfte</span></div>
  <div class="hud"><span class="pill">👣 <b id="steps">0</b> adım</span><span class="pill">🎯 en kısa: <b id="best">–</b></span></div>
  <div class="arena maze-arena" id="arena"><div class="maze" id="maze"></div></div>
  <div class="dpad"><button class="ctrl" data-d="u">▲</button><button class="ctrl" data-d="l">◀</button><button class="ctrl" data-d="d">▼</button><button class="ctrl" data-d="r">▶</button></div>
  <div class="status" id="status"></div>
</template>

<script src="assets/zy11.js"></script>
<script>
const ROOMS = 9;
let mazeEl, statusEl, M, N, cells, me, goal, items, got, steps, won, toks, optimal;

function gen(rooms) {
  const n = rooms * 2 + 1, m = Array.from({ length: n }, () => Array(n).fill(1));
  const seen = Array.from({ length: rooms }, () => Array(rooms).fill(false)), st = [[0, 0]];
  seen[0][0] = true; m[1][1] = 0;
  while (st.length) {
    const [r, c] = st[st.length - 1];
    const o = [[0,1],[0,-1],[1,0],[-1,0]].filter(([a, b]) => { const R = r + a, C = c + b; return R >= 0 && R < rooms && C >= 0 && C < rooms && !seen[R][C]; });
    if (!o.length) { st.pop(); continue; }
    const [a, b] = o[Math.floor(Math.random() * o.length)];
    m[2*r+1+a][2*c+1+b] = 0; m[2*(r+a)+1][2*(c+b)+1] = 0; seen[r+a][c+b] = true; st.push([r+a, c+b]);
  }
  // birkaç ekstra geçit: tek yol olmasın
  for (let k = 0; k < rooms; k++) { const r = 1 + Math.floor(Math.random() * (n - 2)), c = 1 + Math.floor(Math.random() * (n - 2)); if ((r + c) % 2 === 1) m[r][c] = 0; }
  return m;
}
function bfs(a, b) {
  const d = Array.from({ length: N }, () => Array(N).fill(-1)), q = [[a.r, a.c]]; d[a.r][a.c] = 0;
  while (q.length) { const [r, c] = q.shift(); if (r === b.r && c === b.c) return d[r][c];
    for (const [x, y] of [[0,1],[0,-1],[1,0],[-1,0]]) { const R = r + x, C = c + y; if (!M[R][C] && d[R][C] < 0) { d[R][C] = d[r][c] + 1; q.push([R, C]); } } }
  return 999;
}

function init() {
  mazeEl = ZY.$('#maze'); statusEl = ZY.$('#status');
  M = gen(ROOMS); N = M.length; me = { r: 1, c: 1 }; goal = { r: N - 2, c: N - 2 }; got = { C: false, M: false }; steps = 0; won = false;
  const pick = (r0, c0) => ({ r: 2 * (r0 + Math.floor(Math.random() * 3)) + 1, c: 2 * (c0 + Math.floor(Math.random() * 3)) + 1 });
  items = { C: pick(ROOMS - 3, 0), M: pick(0, ROOMS - 3) };
  const s = me, C = items.C, Mo = items.M;
  optimal = Math.min(bfs(s, C) + bfs(C, Mo) + bfs(Mo, goal), bfs(s, Mo) + bfs(Mo, C) + bfs(C, goal));
  const w = Math.min(400, ZY.$('#arena').clientWidth - 24);
  const size = Math.floor(w / N);
  mazeEl.style.setProperty('--c', size + 'px');
  mazeEl.style.gridTemplateColumns = 'repeat(' + N + ', var(--c))';
  mazeEl.innerHTML = ''; cells = [];
  for (let r = 0; r < N; r++) { cells.push([]); for (let c = 0; c < N; c++) { const d = document.createElement('div'); d.className = 'cell ' + (M[r][c] ? 'w' : 'p'); mazeEl.appendChild(d); cells[r].push(d); } }
  toks = {};
  const mk = (k, e, pos, cls) => { const t = document.createElement('div'); t.className = 'tok ' + (cls || ''); t.textContent = e; mazeEl.appendChild(t); toks[k] = t; put(t, pos); };
  mk('C', '🍗', items.C); mk('M', '🥤', items.M); mk('G', '🌯', goal, 'goal locked'); mk('me', '😋', me, 'me');
  ZY.$('#best').textContent = optimal; hud();
  statusEl.className = 'status'; statusEl.textContent = '😋 "Ben açım" — önce 🍗 ve 🥤 topla';
}
function put(t, p) { t.style.left = 'calc(var(--c) * ' + p.c + ')'; t.style.top = 'calc(var(--c) * ' + p.r + ')'; }
function hud() {
  ZY.$('#steps').textContent = steps;
  ZY.$('#bC').classList.toggle('got', got.C); ZY.$('#bM').classList.toggle('got', got.M); ZY.$('#bG').classList.toggle('got', won);
}

function move(dr, dc) {
  if (won || !M) return;
  const r = me.r + dr, c = me.c + dc;
  if (M[r][c]) { ZY.beep(140, .06, 'square', .06); return; }
  if (r === goal.r && c === goal.c && !(got.C && got.M)) { statusEl.className = 'status bad'; statusEl.textContent = 'Favori üçlü eksik! 🍗🥤 olmadan çiğköfte olmaz.'; ZY.shake(toks.G); ZY.sfx.bad(); return; }
  cells[me.r][me.c].className = 'cell t';
  me = { r, c }; steps++; put(toks.me, me); ZY.beep(420 + (steps % 4) * 30, .03, 'triangle', .05);
  for (const k of ['C', 'M']) if (!got[k] && items[k].r === r && items[k].c === c) {
    got[k] = true; toks[k].remove(); ZY.sfx.good(); ZY.burstAt(toks.me, { count: 16, colors: ['#ff8a3d', '#ffd23f', '#fff'] });
    statusEl.className = 'status good'; statusEl.textContent = k === 'C' ? 'Popeyes alındı! 🍗 Göz parıltısı başladı.' : 'Beyaz Monster alındı! 🥤 Enerji %200.';
    if (got.C && got.M) { toks.G.classList.remove('locked'); statusEl.textContent += ' Şimdi çiğköfteye! 🌯'; }
  }
  hud();
  if (r === goal.r && c === goal.c) {
    won = true; hud(); ZY.burstAt(toks.me, { count: 30 });
    const ratio = steps / optimal;
    ZY.complete({ stars: ratio <= 1.25 ? 3 : ratio <= 1.7 ? 2 : 1, stats: '👣 ' + steps + ' adım (en kısa yol: ' + optimal + ')', msg: '😋 Tam kapasite mutluluk modu: AKTİF' });
  }
}

const DIRS = { u: [-1, 0], d: [1, 0], l: [0, -1], r: [0, 1] };
document.addEventListener('keydown', e => { const k = { ArrowUp: 'u', ArrowDown: 'd', ArrowLeft: 'l', ArrowRight: 'r' }[e.key]; if (k) { e.preventDefault(); move(...DIRS[k]); } });
let hold = null;
document.addEventListener('pointerdown', e => {
  const b = e.target.closest('.dpad .ctrl'); if (!b) return; e.preventDefault();
  const d = DIRS[b.dataset.d]; move(...d); clearInterval(hold); hold = setInterval(() => move(...d), 140);
});
['pointerup', 'pointercancel', 'pointerleave'].forEach(t => document.addEventListener(t, () => clearInterval(hold)));
let sw = null;
document.addEventListener('pointerdown', e => { if (e.target.closest('#maze')) sw = { x: e.clientX, y: e.clientY }; });
document.addEventListener('pointerup', e => {
  if (!sw) return; const dx = e.clientX - sw.x, dy = e.clientY - sw.y; sw = null;
  if (Math.max(Math.abs(dx), Math.abs(dy)) < 18) return;
  // kaydırınca kavşağa kadar kay
  const d = Math.abs(dx) > Math.abs(dy) ? [0, dx > 0 ? 1 : -1] : [dy > 0 ? 1 : -1, 0];
  let n = 0; const slide = () => { const before = steps; move(...d); if (steps === before || ++n > 20 || won) return;
    const side = d[0] ? [[0,1],[0,-1]] : [[1,0],[-1,0]]; if (side.some(([a, b]) => !M[me.r + a][me.c + b])) return; setTimeout(slide, 45); };
  slide();
});

ZY.page(5, {
  intro: 'Zanlının beslenme alışkanlıklarıyla ilgili ihbarlar değerlendirildi. Bulgular net: bu bir iştah değil, bir yaşam biçimi.',
  evidence: [
    'Zanlının Popeyes ve çiğköfteye karşı doyma bilmeyen bir zaafı olduğu tespit edildi. Tabağı ne kadar dolu gelirse gelsin, sonunda mutlaka boş kalıyor.',
    'Beslenme kayıtlarına göre favori üçlüsü net: Popeyes, çiğköfte ve yanında mutlaka beyaz Monster. Bu üçlü bir araya geldiğinde zanlı "tam kapasite mutluluk" moduna geçiyor.',
    'Yemek önüne geldiği anda gözünde bir parıltı beliriyor ve yemeğe adeta azarak saldırıyor. Uzmanlar bu ana "iştah patlaması" adını verdi.',
    'Görgü tanıklarına göre her buluşmada ilk cümlesi "ben açım" oluyor. Karşısındaki bunu söylemesine bile gerek duymuyor, çünkü zaten biliyor.',
  ],
  verdict: 'Zanlı resmi olarak "Doymayan" ilan edilmiştir — iştahı bulaşıcı, mutluluğu sınırsız, tabağı hep boş. 🍗🌯',
  mission: { title: '🌯 Doymayan\'ın Labirenti', sub: 'Önce 🍗 Popeyes ve 🥤 Monster\'ı topla, sonra çiğköfteye 🌯 ulaş. Kaydır (kavşağa kadar kayar), ok tuşları ya da butonlar.', goals: ['Bitir', 'Kısa yol ×1.7', 'Kısa yol ×1.25'] },
  init,
});
</script>
</body>
</html>
