<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#1a1145">
<title>Vaka 11 · Son Dosya — ZY-11</title>
<link rel="stylesheet" href="assets/style.css">
<style>
.stage { display: none; } .stage.on { display: block; animation: rise .5s ease both; }
.st-title { font-family: var(--font-head); font-weight: 800; font-size: 1.35rem; text-align: center; }
.st-sub { color: var(--text-dim); text-align: center; max-width: 480px; margin: 4px auto 16px; line-height: 1.5; font-size: .95rem; }
.vault { display: grid; grid-template-columns: repeat(5, 1fr); gap: 8px; max-width: 420px; margin: 0 auto 16px; }
.vc { display: flex; flex-direction: column; align-items: center; gap: 4px; }
.vc label { font-size: .7rem; font-weight: 800; color: var(--text-faint); }
.vc input { width: 100%; max-width: 66px; text-align: center; font-family: var(--font-mono); font-weight: 700; font-size: 1.35rem; letter-spacing: 2px; padding: 10px 0;
  border-radius: 14px; border: 2px solid var(--line); background: rgba(0,0,0,.3); color: var(--yellow); transition: border-color .2s, box-shadow .2s; }
.vc input:focus { outline: none; border-color: var(--cyan); box-shadow: var(--glow-cyan); }
.vc input.good { border-color: var(--lime); box-shadow: 0 0 12px rgba(166,255,77,.4); }
.vc input.bad { border-color: var(--red); box-shadow: 0 0 12px rgba(255,77,94,.5); }
.dial { width: 120px; height: 120px; margin: 0 auto 16px; border-radius: 50%; display: grid; place-items: center; font-size: 3rem;
  background: radial-gradient(circle at 35% 30%, #6d5bd0, #2a1d6b); border: 6px solid rgba(255,210,63,.6); box-shadow: 0 0 30px rgba(255,210,63,.35), inset 0 0 20px rgba(0,0,0,.5); transition: transform .8s cubic-bezier(.3,1.4,.6,1); }
.dial.open { transform: rotate(360deg) scale(1.1); border-color: var(--lime); box-shadow: 0 0 40px rgba(166,255,77,.6); }
.qprog { display: flex; gap: 4px; justify-content: center; margin-bottom: 14px; }
.qprog i { width: 22px; height: 7px; border-radius: 999px; background: rgba(255,255,255,.12); }
.qprog i.on { background: var(--grad-lime); }
.qcard { max-width: 480px; margin: 0 auto; }
.qhead { display: flex; justify-content: space-between; font-family: var(--font-mono); font-weight: 700; font-size: .7rem; letter-spacing: 1px; color: var(--text-faint); margin-bottom: 8px; }
.qtext { font-family: var(--font-head); font-weight: 700; font-size: 1.2rem; line-height: 1.3; margin-bottom: 14px; }
.qopt { width: 100%; text-align: left; margin-bottom: 8px; padding: 13px 15px; border-radius: 16px; border: 1px solid var(--line); background: var(--surface-2); font-size: .95rem; cursor: pointer; animation: rise .3s ease both; }
.qopt.right { border-color: var(--lime); background: rgba(166,255,77,.16); }
.qopt.wrong { border-color: var(--red); background: rgba(255,77,94,.14); opacity: .7; }
.qhint { min-height: 24px; text-align: center; font-weight: 700; margin-top: 6px; }
.reveal-h { text-align: center; font-family: var(--font-head); font-weight: 800; font-size: 2rem; line-height: 1.1; }
.reveal-h em { font-style: normal; background: var(--grad-hot); -webkit-background-clip: text; background-clip: text; color: transparent; }
.aliases { display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: 10px; margin: 18px 0 22px; }
.alias { padding: 12px; border-radius: 18px; background: var(--surface); border: 1px solid var(--line); position: relative; overflow: hidden;
  opacity: 0; transform: scale(.6) rotate(var(--r)); transition: all .5s cubic-bezier(.3,1.6,.6,1); }
.alias::before { content: ''; position: absolute; inset: 0 0 auto; height: 4px; background: var(--g); }
.alias.on { opacity: 1; transform: scale(1) rotate(var(--r)); }
.alias .e { font-size: 1.7rem; } .alias .x { font-family: var(--font-mono); font-size: .68rem; color: var(--text-faint); text-decoration: line-through; }
.alias .m { font-weight: 700; font-size: .88rem; line-height: 1.3; margin-top: 2px; }
.eq { text-align: center; line-height: 1.7; color: var(--text-dim); opacity: 0; transition: opacity .8s; margin-bottom: 22px; }
.eq.on { opacity: 1; } .eq b { font-family: var(--font-head); font-size: 1.6rem; background: var(--grad-gold); -webkit-background-clip: text; background-clip: text; color: transparent; }
.letter { max-width: 560px; margin: 0 auto; padding: 26px 22px; border-radius: 22px; background: #fff8ee; color: #2a1a3e; transform: rotate(.5deg);
  box-shadow: 0 20px 40px rgba(0,0,0,.45); opacity: 0; transition: opacity .8s; background-image: repeating-linear-gradient(transparent 0 29px, rgba(255,77,157,.13) 29px 30px); }
.letter.on { opacity: 1; }
.letter-body { font-size: 1.05rem; line-height: 30px; white-space: pre-wrap; min-height: 120px; font-weight: 600; }
.letter-sign { text-align: right; font-family: var(--font-head); font-weight: 700; color: #d6246e; margin-top: 8px; opacity: 0; transition: opacity .6s; }
.letter-sign.on { opacity: 1; }
.closed { display: block; width: fit-content; margin: 26px auto 8px; padding: 8px 18px; border: 3px double var(--lime); color: var(--lime); border-radius: 10px;
  font-family: var(--font-mono); font-weight: 700; letter-spacing: 3px; transform: rotate(-6deg) scale(2.2); opacity: 0; transition: all .45s cubic-bezier(.3,1.6,.6,1); }
.closed.on { opacity: 1; transform: rotate(-6deg) scale(1); }
.end { display: none; } .end.on { display: flex; }
.secret-tease { margin-top: 16px; text-align: center; padding: 14px; border-radius: 16px; border: 1px dashed rgba(51,225,255,.5); background: rgba(51,225,255,.08); }
@media (max-width: 480px) { .aliases { grid-template-columns: 1fr 1fr; } .vc input { font-size: 1.15rem; letter-spacing: 1px; } }
</style>
</head>
<body>
<div class="app" id="app"></div>
<template id="mission">
  <div class="section-label">🔐 Adım 1 · Ana Şifre</div>
  <div class="card stage on" id="sCode">
    <div class="dial" id="dial">🔒</div>
    <div class="st-title">Kasayı aç</div>
    <p class="st-sub">Her vakadan aldığın kodu sırasıyla gir. 10 kod birleşince kasa açılır.</p>
    <div class="vault" id="vault"></div>
    <div class="btn-row"><button class="btn ghost small" id="fillBtn">📒 Defterden doldur</button><button class="btn gold" id="checkBtn">🔓 Kasayı Aç</button></div>
    <div class="status" id="codeStatus"></div>
  </div>
  <div class="card stage" id="sQuiz">
    <div class="st-title">🕵️ Son Sorgu</div>
    <p class="st-sub">Dosyayı sadece kanıtları gerçekten okuyan biri görebilir. Her vakadan bir soru — hatasız bitirirsen 3 yıldız!</p>
    <div class="qprog" id="qprog"></div>
    <div class="qcard"><div class="qhead"><span id="qcase"></span><span id="qnum"></span></div><div class="qtext" id="qtext"></div><div id="qopts"></div><div class="qhint" id="qhint"></div></div>
  </div>
  <div class="stage" id="sReveal">
    <div class="card">
      <div class="reveal-h">Zeynep Gerçekten <em>Kim?</em></div>
      <p class="st-sub">Tüm lakaplar yan yana konunca soruşturma ekibi bambaşka bir şey gördü...</p>
      <div class="aliases" id="aliases"></div>
      <div class="eq" id="eq">Hırsız + Spastik + Çakma Gotik + Lolcu + Doymayan + Midesiz + Yürüyemeyen + Uzaylı + Abi + Sevimli<br>= <b>Zeynep</b><br>Tek bir insanda on ayrı güzellik. Bu bir suç dosyası değilmiş; bir teşekkür dosyasıymış. 💛</div>
      <div class="letter" id="letter"><div class="letter-body" id="lbody"></div><div class="letter-sign" id="lsign"></div></div>
      <div class="closed" id="closed">DOSYA KAPANDI ✓</div>
      <div class="btn-row end" id="end"><a class="btn cool" href="index.html">🗺 Haritaya Dön</a><button class="btn ghost" id="replay">💌 Tekrar oku</button></div>
      <div class="secret-tease" id="tease" style="display:none"></div>
    </div>
  </div>
</template>

<script src="assets/zy11.js"></script>
<script>
// ✏️ Son mektup — buradaki metni istediğin gibi değiştirebilirsin.
const LETTER = `Sevgili Zeynep,

Bu dosyayı açtıysan on görevi de bitirdin demektir. Tebrikler dedektif, ama asıl zanlı sensin. 🕵️‍♀️

Her vakada seni biraz tiye aldık, farkındasın. Ama dikkat ettiysen her dosyanın sonunda aynı karar çıktı: suçsuz. Çünkü gülümsemeleri çalıp yerine daha fazlasını bırakan, düz yolda tökezleyip ilk gülen, "kim üzdü seni" diye kollarını sıvayan, gecenin üçünde bile enerjisi bitmeyen birini mahkûm etmek mümkün değil.

Zeynep gerçekten kim?
Bir kedi, bir köpek, bir uzaylı, bir abi... ve hepsinden önce, hayatımızda olduğu için çok şanslı olduğumuz biri.

İyi ki varsın. 💛`;
const SIGN = '— Dosyayı hazırlayan, en sadık dedektifin 🐾';

const TRUE = ['Gülümsemeleri çalıp yerine huzur bırakan', 'Herkesin gününü kurtaran bulaşıcı enerji', 'Kıştan kışa gotik, her mevsim rengârenk', 'Gecenin 3\'ünde bile sadık, bitmeyen neşe', 'Hayattan tat almayı en iyi bilen', '"Bir şey olmaz ya" cesareti', 'Düşse bile ilk gülen', 'Farklı olmaktan korkmayan, herkesi seven', 'Pati kadar yumuşak, kaya kadar sağlam', 'Ölçülemeyecek kadar sevimli'];
const QUIZ = [
  { c: 1, q: 'Hırsız Kedi ortamlardan aslında neyi çalıyor?', a: ['İnsanların gülümsemesini', 'Kolyeleri ve parayı', 'Herkesin patateslerini'], h: 'Tanıklar "kalbim eksik döndü" diyordu...' },
  { c: 2, q: 'Spastik zanlı salıncakta sallanırken ne yapıyor?', a: ['Kafasında koca bir dünya kurup overthink ediyor', 'Uyuyakalıyor', 'Opera söylüyor'], h: 'Vücut sakin, kafa 200 km hızla...' },
  { c: 3, q: 'Çakma Gotik\'in üzerinde gerçekten gotik olan tek şey ne?', a: ['Siyah oje', 'Siyah botlar', 'Siyah ruj'], h: '"Gotik olan sadece on tırnak."' },
  { c: 4, q: 'Lolcu Köpek kimliği en çok ne zaman ortaya çıkıyor?', a: ['Gecenin 3\'ünde', 'Sabah 7\'de', 'Öğle arasında'], h: 'Herkes uyurken o hâlâ nöbette.' },
  { c: 5, q: 'Doymayan\'ın "tam kapasite mutluluk" üçlüsü hangisi?', a: ['Popeyes + çiğköfte + beyaz Monster', 'Pizza + kola + dondurma', 'Salata + su + yoğurt'], h: 'Labirentte topladıklarını hatırla 🍗🥤🌯' },
  { c: 6, q: 'Midesiz zanlının tek düşmanı ne?', a: ['Diyet salatası', 'Acı biber', 'Soğuk pizza'], h: 'Oyunda can götüren şey 🥗' },
  { c: 7, q: 'Düz kaldırımda tökezleyince zanlının ifadesi neydi?', a: ['"Yer beni itti."', '"Ayakkabım kaydı."', '"Bilerek yaptım."'], h: 'Suç her zaman yerde.' },
  { c: 8, q: 'Uzaylı Kedi\'ye Dünya\'da ne verildi?', a: ['Kalıcı oturma izni', 'Sınır dışı kararı', '3 günlük turist vizesi'], h: 'Tehdit değil, kazanç olduğu anlaşıldı.' },
  { c: 9, q: 'Pisicik Abi, bir arkadaşı üzülünce ne der?', a: ['"Adını ver, gerisini ben hallederim."', '"Takma, geçer."', '"Bana ne."'], h: 'İçerideki koca abi konuşuyor 😼' },
  { c: 10, q: 'Önceki dokuz dosyadaki tüm "suçların" ortak sebebi ne çıktı?', a: ['Zanlının fazlasıyla sevimli olması', 'Uykusuzluk', 'Kötü şans'], h: 'Ölçüm cihazları bu yüzden bozuldu 😻' },
];
const $ = ZY.$;
function go(id) { ['sCode', 'sQuiz', 'sReveal'].forEach(s => $('#' + s).classList.toggle('on', s === id)); $('#' + id).scrollIntoView({ behavior: 'smooth', block: 'start' }); }

let inputs = [], qi = 0, wrong = 0;
function init() {
  const v = $('#vault');
  inputs = ZY.MAIN.map((c, i) => {
    const d = document.createElement('div'); d.className = 'vc';
    d.innerHTML = '<label>' + c.emoji + ' ' + c.n + '</label><input inputmode="numeric" maxlength="2" autocomplete="off" aria-label="' + c.n + '. vaka kodu">';
    v.appendChild(d);
    const inp = d.querySelector('input');
    inp.oninput = () => { inp.value = inp.value.replace(/\D/g, '').slice(0, 2); inp.classList.remove('good', 'bad'); if (inp.value.length === 2 && inputs[i + 1]) inputs[i + 1].focus(); };
    inp.onkeydown = e => { if (e.key === 'Backspace' && !inp.value && i) inputs[i - 1].focus(); if (e.key === 'Enter') check(); };
    return inp;
  });
  $('#fillBtn').onclick = () => {
    let n = 0; ZY.MAIN.forEach((c, i) => { if (ZY.isSolved(c.n)) { inputs[i].value = c.code; n++; } });
    $('#codeStatus').className = 'status'; $('#codeStatus').textContent = n === 10 ? '📒 Defterde 10 kodun hepsi var!' : '📒 Defterde ' + n + ' kod bulundu, eksikleri kendin gir.';
    ZY.sfx.tap();
  };
  $('#checkBtn').onclick = check;
  QUIZ.forEach(() => $('#qprog').appendChild(document.createElement('i')));
  $('#replay').onclick = typeLetter;
  if (ZY.isSolved(11)) {
    $('#codeStatus').textContent = '✅ Bu dosyayı daha önce çözdün.';
    const b = document.createElement('button'); b.className = 'btn cool small'; b.textContent = '💌 Doğrudan sona git';
    b.onclick = () => { go('sReveal'); reveal(); }; $('#sCode .btn-row').appendChild(b);
  }
}
function check() {
  let ok = true;
  ZY.MAIN.forEach((c, i) => { const g = inputs[i].value === c.code; inputs[i].classList.toggle('good', g); inputs[i].classList.toggle('bad', !g); if (!g) ok = false; });
  const st = $('#codeStatus');
  if (!ok) {
    ZY.sfx.bad(); ZY.shake($('#vault'));
    st.className = 'status bad'; st.textContent = '❌ Şifre hatalı. Kırmızı kutuları kontrol et.'; return;
  }
  $('#dial').classList.add('open'); $('#dial').textContent = '🔓'; ZY.sfx.win(); ZY.burstAt($('#dial'), { count: 40 });
  st.className = 'status good'; st.textContent = '🔓 ' + ZY.FULL_CODE;
  setTimeout(() => { go('sQuiz'); qi = 0; wrong = 0; showQ(); }, 1300);
}
function showQ() {
  const q = QUIZ[qi];
  [...$('#qprog').children].forEach((d, i) => d.classList.toggle('on', i < qi));
  $('#qcase').textContent = 'VAKA ' + q.c + ' · ' + ZY.CASES[q.c - 1].alias.toUpperCase(); $('#qnum').textContent = (qi + 1) + '/' + QUIZ.length;
  $('#qtext').textContent = q.q; $('#qhint').textContent = ''; $('#qopts').innerHTML = '';
  ZY.shuffle(q.a.map((t, i) => ({ t, ok: !i }))).forEach((o, k) => {
    const b = document.createElement('button'); b.className = 'qopt'; b.style.animationDelay = (k * .06) + 's'; b.textContent = o.t;
    b.onclick = () => answer(o, b); $('#qopts').appendChild(b);
  });
}
function answer(o, b) {
  const h = $('#qhint');
  if (!o.ok) { wrong++; b.classList.add('wrong'); b.disabled = true; ZY.sfx.bad(); ZY.shake(b); h.style.color = 'var(--red)'; h.textContent = '🔍 İpucu: ' + QUIZ[qi].h; return; }
  b.classList.add('right'); $('#qopts').querySelectorAll('button').forEach(x => x.disabled = true); ZY.sfx.good(); ZY.burstAt(b, { count: 10, colors: ['#a6ff4d', '#fff'] });
  h.style.color = 'var(--lime)'; h.textContent = '✓ Doğru!';
  setTimeout(() => { qi++; if (qi < QUIZ.length) return showQ(); [...$('#qprog').children].forEach(d => d.classList.add('on')); go('sReveal'); reveal(); }, 750);
}
let revealed = false;
async function reveal() {
  if (revealed) return; revealed = true;
  const first = !ZY.isSolved(11);
  ZY.markSolved(11);
  if (QUIZ.length && qi >= QUIZ.length) ZY.setStars(11, wrong === 0 ? 3 : wrong <= 2 ? 2 : 1);
  const box = $('#aliases'); box.innerHTML = '';
  const els = ZY.MAIN.map((c, i) => {
    const d = document.createElement('div'); d.className = 'alias';
    d.style.setProperty('--r', ((i % 2 ? 1 : -1) * (1 + Math.random() * 2)).toFixed(1) + 'deg'); d.style.setProperty('--g', c.grad);
    d.innerHTML = '<div class="e">' + c.emoji + '</div><div class="x">"' + c.alias + '"</div><div class="m">' + TRUE[i] + '</div>';
    box.appendChild(d); return d;
  });
  await ZY.wait(500);
  for (const d of els) { d.classList.add('on'); ZY.beep(500 + Math.random() * 500, .06, 'triangle', .08); await ZY.wait(300); }
  await ZY.wait(300); $('#eq').classList.add('on'); await ZY.wait(1300);
  $('#letter').classList.add('on'); await ZY.wait(400);
  await typeLetter();
  if (first) ZY.toast('⭐ Son sorgu: ' + ZY.stars(11) + ' yıldız');
}
async function typeLetter() {
  const body = $('#lbody'); body.textContent = '';
  ['#lsign', '#closed', '#end'].forEach(s => $(s).classList.remove('on'));
  let skip = false; $('#letter').addEventListener('click', () => skip = true, { once: true });
  for (let i = 0; i < LETTER.length; i++) {
    if (skip) { body.textContent = LETTER; break; }
    body.textContent += LETTER[i];
    await ZY.wait(LETTER[i] === '\n' ? 170 : '.,?!'.includes(LETTER[i]) ? 110 : 22);
  }
  $('#lsign').textContent = SIGN; $('#lsign').classList.add('on'); await ZY.wait(600);
  $('#closed').classList.add('on'); ZY.beep(220, .3, 'triangle'); ZY.buzz(80); ZY.confetti(160); await ZY.wait(500);
  $('#end').classList.add('on');
  const t = $('#tease'), total = ZY.totalStars();
  t.style.display = 'block';
  t.innerHTML = total >= ZY.STARS_NEEDED
    ? '🌌 <b>Gizli dosya açıldı!</b><br><a class="btn cool small" style="margin-top:10px" href="vaka12.html">12. Vakaya git →</a>'
    : '🌌 <b>Psst...</b> Bir dosya daha var. İlk 10 vakadan <b>' + ZY.STARS_NEEDED + ' yıldızın hepsini</b> toplarsan gizli 12. dosya açılır. Şu an: <b>' + total + ' / ' + ZY.STARS_NEEDED + ' ⭐</b>';
}

ZY.page(11, {
  stamp: 'ÇOK GİZLİ',
  intro: 'On dosya, on lakap, on kod. Hepsi aynı soruya çıkıyor: Zeynep gerçekten kim? Cevap bu dosyada — ama önce şifreyi çözmen ve son sorgudan geçmen gerekiyor.',
  init,
});
</script>
</body>
</html>
